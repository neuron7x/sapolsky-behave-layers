# CWC Hypothesis Registry (schema: schemas/hypothesis.schema.json)
# Every claim in claim_registry.json links here via hypothesis_id.
# Preregistrations are the experiments/*/PREREGISTRATION*.md committed before each run.

hypotheses:
  - hypothesis_id: H-L0
    research_question_id: RQ-measure
    type: confirmatory
    H0: "Instrumentation measurements are non-deterministic or internally invalid."
    H1: "Instrumentation records deterministic, internally-validated resource measurements."
    estimand: "test/coverage/mutation pass rates on the instrumentation package"
    experimental_unit: "instrumentation test case"
    decision_rule: "SUPPORTED iff determinism + mutation + coverage gates all pass"
    preregistration: docs/WP1_INSTRUMENTATION.md
    status: SUPPORTED
    claim_id: CWC-L0-measurement

  - hypothesis_id: H-L1
    research_question_id: RQ-identifiable
    type: confirmatory
    H0: "No benchmark has a real adaptive-compute advantage (oracle <= best-fixed)."
    H1: "A benchmark exists where an oracle strictly beats the best fixed policy at equal budget."
    estimand: "oracle_gap = U_oracle - U_best_fixed"
    experimental_unit: "benchmark instance"
    decision_rule: "SUPPORTED iff LCB95(oracle - best_fixed) > 0"
    preregistration: experiments/wp2_routing_v2/PREREGISTRATION.md
    status: SUPPORTED
    claim_id: CWC-L1-identifiability

  - hypothesis_id: H-L2
    research_question_id: RQ-routing
    type: confirmatory
    H0: "A learned controller does not beat random/frozen/shuffled controls."
    H1: "A learned controller routes causally and beats all controls."
    estimand: "balanced routing accuracy, AUROC, counterfactual route effect"
    experimental_unit: "model seed (paired)"
    decision_rule: "SUPPORTED iff learned < random,frozen,shuffled AND forced-route interventions establish causality"
    minimum_meaningful_effect: "bal_acc lift > 0.05 over best control"
    preregistration: experiments/wp2_routing_v2/PREREGISTRATION.md
    status: SUPPORTED_NARROWED
    claim_id: CWC-L2-routing-causality
    amendments: ["narrowed after review: value distillation, label-derived capacity, surface cues, no physical saving"]

  - hypothesis_id: H-L2a
    research_question_id: RQ-routing
    type: confirmatory
    H0: "No leakage-free-target controller routes above chance (H_deep)."
    H1: "A REINFORCE controller routes at oracle level under a binding budget (H_opt)."
    estimand: "learned_loss vs random_loss; route AUROC at fixed label-free budget"
    experimental_unit: "model seed (paired), 8 seeds"
    decision_rule: "SUPPORTED iff mean(learned)<mean(random), paired 95% UB<0, worst-seed AUROC>0.5"
    preregistration: experiments/wp2_routing_v2/PREREGISTRATION_R3C_REINFORCE.md
    status: SUPPORTED
    claim_id: CWC-L2a-e2e-reinforce

  - hypothesis_id: H-L2b
    research_question_id: RQ-routing
    type: confirmatory
    H0: "A cheap controller can route on a surface-matched task (H_cheap-route)."
    H1: "The route decision costs ~the expensive computation (H_route-is-compute)."
    estimand: "eval AUROC + loss saving for cheap and attn controllers; supervised-probe AUROC"
    experimental_unit: "model seed, 8 seeds x 4 arms"
    decision_rule: "H_route-is-compute iff no arm clears AUROC LB>0.5 with loss saving, and probes at chance"
    preregistration: experiments/wp2_routing_v2/PREREGISTRATION_SURFACE_MATCHED.md
    status: SUPPORTED
    claim_id: CWC-L2b-route-decision-cost

  - hypothesis_id: H-L2p
    research_question_id: RQ-allocation
    type: confirmatory
    H0: "Adaptive allocation does not beat best-static beyond capacity/compute/optimization."
    H1: "Adaptive allocation beats best-static by exactly P(m>K)."
    estimand: "measured_gap - P(m>K)"
    experimental_unit: "seed x difficulty regime (8 x 4)"
    decision_rule: "SUPPORTED iff |measured_gap - P(m>K)| ~ 0 across regimes AND beats input-blind random"
    preregistration: experiments/wp4_adaptive_depth/PREREGISTRATION.md
    status: SUPPORTED
    claim_id: CWC-L2p-jensen-gap

  - hypothesis_id: H-L2c
    research_question_id: RQ-routing
    type: confirmatory
    H0: "Straight-through top-K end-to-end routing is not causal."
    H1: "Straight-through top-K end-to-end routing is causal."
    estimand: "learned_loss vs random_loss at fixed label-free budget"
    experimental_unit: "model seed, 8 seeds"
    decision_rule: "SUPPORTED iff learned<random; result NOT_SUPPORTED (collapse), superseded by H-L2a"
    preregistration: experiments/wp2_routing_v2/PREREGISTRATION.md
    status: NOT_SUPPORTED
    claim_id: CWC-L2c-e2e-straightthrough

  - hypothesis_id: H-L2q
    research_question_id: RQ-allocation
    type: confirmatory_internal
    H0: "Paid halt information eliminates the adaptive allocation advantage."
    H1: "Adaptive allocation beats input-blind allocation under an equal successor-lookup budget."
    estimand: "solved(adaptive_paid_probe) - mean solved(input_blind_exact)"
    experimental_unit: "seed x distribution (16 x 7)"
    decision_rule: "All development and >=2/3 held-out cells: CI lower>0.02, Holm p<0.05, worst seed>0"
    preregistration: experiments/wp4_adaptive_depth/PROTOCOL_END_TO_END_COST_V4.md
    status: SUPPORTED_INTERNAL
    claim_id: CWC-L2q-paid-halt-lookup

  - hypothesis_id: H-L3
    research_question_id: RQ-reuse
    type: confirmatory
    H0: "Role-conditioned functional reuse is not novel / not better than prior art."
    H1: "RCFR is a novel mechanism beyond DISeL/HyperFormer."
    estimand: "RCFR vs role-conditioned prior-art baseline"
    experimental_unit: "model seed"
    decision_rule: "SUPPORTED iff RCFR strictly beats matched prior art; result NOT_SUPPORTED (ties)"
    preregistration: experiments/wp3_rcfr/PREREGISTRATION.md
    status: NOT_SUPPORTED
    claim_id: CWC-L3-rcfr

  - hypothesis_id: H-L4
    research_question_id: RQ-plasticity
    type: confirmatory
    H0: "Under a cost budget, no context-conditioned allocation beats the best fixed allocation (oracle gap = 0)."
    H1: "Under a cost budget, a context-conditioned allocation beats every fixed allocation (oracle gap > 0)."
    estimand: "oracle allocation gap under cost budget (lambda=1)"
    experimental_unit: "model seed"
    decision_rule: "reject H0 iff debiased G_lo > 0 at delta=0.05 on held-out seeds with lambda frozen a priori; CONFIRMED (G_lo=0.111, 16/16 seeds). L4a: a reward-only learned governor recovers 100% of the gap on held-out (8/8 controller seeds, NULL falsifier 0). Scope: synthetic, given-context, wide-margin; no L7."
    preregistration: experiments/wp3_plasticity_v2_confirmatory/PREREGISTRATION.md ; experiments/wp3_plasticity_v3_governor/PREREGISTRATION.md
    status: SUPPORTED_NARROWED
    claim_id: CWC-L4-plasticity

  - hypothesis_id: H-L4b
    research_question_id: RQ-plasticity
    type: confirmatory
    H0: "The learned governor's realised value is independent of the context information I(C;Z) (no route-decision cost)."
    H1: "The learned governor's realised value is bounded by and decreases with lower I(C;Z), vanishing where the context cannot be cheaply inferred."
    estimand: "held-out recovery as a function of context information I(C;Z)"
    experimental_unit: "controller seed"
    decision_rule: "L4B_BOUNDARY_MAPPED iff recovery reproduces L4a at full info, is monotone in I(C;Z), yields no gap at I=0, and tracks the grounded prediction OR abstains. MAPPED: tracks 1-2.146p to +/-0.001, abstains 8/8 at p*~0.466."
    preregistration: experiments/wp3_plasticity_v4_inferred/PREREGISTRATION.md
    status: SUPPORTED
    claim_id: CWC-L4b-inferred-context

  - hypothesis_id: H-L4c
    research_question_id: RQ-plasticity
    type: confirmatory
    H0: "The governor's credit-assignment collapse margin Delta* is independent of reward noise sigma."
    H1: "The governor's collapse margin Delta* scales linearly with sigma (the (sigma/Delta)^2 sample-complexity law)."
    estimand: "collapse margin Delta* as a function of reward noise sigma"
    experimental_unit: "controller seed"
    decision_rule: "reject H0 iff Delta*(2sigma)/Delta*(sigma) in [1.4,2.8]. RESULT ratio=0.91 -> FAIL to reject H0; H1 FALSIFIED (L4C_SCALING_VIOLATED). Collapse itself is real."
    preregistration: experiments/wp3_plasticity_v5_thinmargin/PREREGISTRATION.md
    status: NOT_SUPPORTED
    claim_id: CWC-L4c-credit-collapse

  - hypothesis_id: H-L4d
    research_question_id: RQ-plasticity
    type: confirmatory
    H0: "The governor's collapse margin does not follow the sample-complexity budget law Delta* ~ 1/sqrt(N)."
    H1: "Delta*(N) ~ 1/sqrt(N) (ratio Delta*(12000)/Delta*(1500) in [0.25,0.55])."
    estimand: "collapse margin Delta* as a function of episode budget N (and re-test vs noise)"
    experimental_unit: "controller seed"
    decision_rule: "reject H0 iff Delta*(12000)/Delta*(1500) in [0.25,0.55]. RESULT 0.247 -> just outside (steeper, ~N^-0.68); noise axis anti-scales (ratio 0.5). FAIL to reject H0; H1 NOT_SUPPORTED on either axis."
    preregistration: experiments/wp3_plasticity_v6_scaling/PREREGISTRATION.md
    status: NOT_SUPPORTED
    claim_id: CWC-L4d-budget-scaling

  - hypothesis_id: H-L4e
    research_question_id: RQ-plasticity
    type: confirmatory
    H0: "A 2-arm ablation does not reproduce the full governor's collapse-margin budget exponent."
    H1: "The collapse is a pure 2-arm phenomenon: the 2-arm ablation reproduces the exponent (within 0.15) and the noise sign."
    estimand: "2-arm reduced budget exponent and noise ratio vs the full 4-arm governor"
    experimental_unit: "controller seed"
    decision_rule: "reject H0 iff |reduced_exponent - (-0.654)| <= 0.15 AND reduced noise ratio < 1. RESULT: exponent -1.117 (mismatch 0.46), noise 0.364<1. FAIL to reject H0; H1 NOT_SUPPORTED (2-arm is drift-limited -1.1; dead-arm diffusion gives the full -0.65). Noise-as-exploration IS 2-arm."
    preregistration: experiments/wp3_plasticity_v7_mechanism/PREREGISTRATION.md
    status: NOT_SUPPORTED
    claim_id: CWC-L4e-mechanism

  - hypothesis_id: H-L4f
    research_question_id: RQ-plasticity
    type: confirmatory
    H0: "The governor's collapse-margin budget exponent does not depend on arm count."
    H1: "The exponent shallows monotonically as arms grow (dead arms inject diffusion)."
    estimand: "budget exponent as a function of arm count K"
    experimental_unit: "controller seed"
    decision_rule: "reject H0 iff exponent monotone non-decreasing in K, shallows by >=0.25, exp(2)<=-0.9. RESULT -1.026/-0.637/-0.459/-0.451/-0.094 -> MAPPED. Caveat: asymptote overshoots -0.5 toward 0; exact values grid-sensitive."
    preregistration: experiments/wp3_plasticity_v8_armscaling/PREREGISTRATION.md
    status: SUPPORTED
    claim_id: CWC-L4f-arm-scaling

  - hypothesis_id: H-L4g
    research_question_id: RQ-plasticity
    type: confirmatory
    H0: "The L4 oracle gap depends on the specific (linear) cost model."
    H1: "The oracle gap and governor recovery survive any monotone cost transform."
    estimand: "certificate G_lo and governor recovery under cost transforms linear/sqrt/log/square"
    experimental_unit: "cost transform"
    decision_rule: "reject H0 iff G_lo>0 and governor recovery>=0.8 for all four transforms. RESULT G_lo 0.111/0.101/0.035/0.043, recovery 1.0 each -> SUPPORTED (robust; magnitude cost-shape dependent)."
    preregistration: experiments/wp3_plasticity_v9_costrobust/PREREGISTRATION.md
    status: SUPPORTED
    claim_id: CWC-L4g-cost-robust

  - hypothesis_id: H-L4h
    research_question_id: RQ-plasticity
    type: confirmatory
    H0: "Adding contexts breaks identifiability or governor recovery even at matched per-context budget."
    H1: "Identifiability and governor recovery hold as |C| grows at constant per-context budget."
    estimand: "certificate G_lo and governor recovery vs context count |C|"
    experimental_unit: "controller seed"
    decision_rule: "reject H0 iff G_lo>0 and recovery>=0.8 for all |C| in {2,3,4,6}. RESULT G_lo 0.084..0.685, recovery >=0.952 -> SUPPORTED (contexts do not interfere; identifiability strengthens with |C|)."
    preregistration: experiments/wp3_plasticity_v10_contexts/PREREGISTRATION.md
    status: SUPPORTED
    claim_id: CWC-L4h-context-scaling

  - hypothesis_id: H-L4i
    research_question_id: RQ-plasticity
    type: confirmatory
    H0: "The learned governor's realised value exceeds V*(I) or is far below it."
    H1: "V_gov <= V*(I) (ceiling) and near-saturates it (>=0.90)."
    estimand: "governor realised value vs the rate function V*(I) across information levels"
    experimental_unit: "information level (flip probability)"
    decision_rule: "reject H0 iff ceiling holds at every level AND min saturation >=0.90. RESULT ceiling holds, min saturation 0.924 -> SUPPORTED (governor realises V*(R))."
    preregistration: experiments/wp3_plasticity_v11_ratebridge/PREREGISTRATION.md
    status: SUPPORTED
    claim_id: CWC-L4i-rate-bridge

  - hypothesis_id: H-L4j
    research_question_id: RQ-plasticity
    type: confirmatory
    H0: "Some L4 claim's registry status disagrees with its artifact verdict, or evidence is orphaned."
    H1: "Every L4 claim's status matches its artifact verdict and no evidence is orphaned."
    estimand: "polarity mismatches and orphan bundles across the L4 sub-line"
    experimental_unit: "claim"
    decision_rule: "reject H0 iff 0 mismatches AND 0 orphans (auditor self-exempt). RESULT 9 claims, 0/0 -> SUPPORTED (L4J_CONSISTENT)."
    preregistration: experiments/wp3_plasticity_v12_consistency/PREREGISTRATION.md
    status: SUPPORTED
    claim_id: CWC-L4j-line-consistency

  - hypothesis_id: H-L4k
    research_question_id: RQ-plasticity
    type: confirmatory
    H0: "A gap survives an interaction-destroying null (the gap is a structural artifact)."
    H1: "The gap appears only with a real interaction and vanishes under every interaction-destroying null."
    estimand: "certificate G_lo and governor recovery on real vs additive/collapsed/aligned-best nulls"
    experimental_unit: "null condition"
    decision_rule: "reject H0 iff real shows the gap AND all three nulls vanish (G_lo<=0, recovery<=0.1). RESULT real 0.111/1.0, nulls -0.053/-0.080/-0.080 with recovery 0 -> SUPPORTED (L4K_LINE_SURVIVES). A mis-specified null was fixed via disclosed amendment."
    preregistration: experiments/wp3_plasticity_v13_killtest/PREREGISTRATION.md
    status: SUPPORTED
    claim_id: CWC-L4k-falsification-boundary

  - hypothesis_id: H-AC1
    research_question_id: RQ-adaptive-compute
    type: confirmatory
    H0: "Adaptive-compute allocation has no identifiable value (a fixed compute matches the oracle)."
    H1: "An oracle compute-budget allocation beats any fixed compute (identifiable), transferring the framework off plasticity."
    estimand: "certificate G_lo on U_lambda[difficulty][compute] over trained seeds"
    experimental_unit: "model seed"
    decision_rule: "reject H0 iff diagonal holds, G_lo>0 at every lambda, and monotone+additive nulls vanish at lambda=0. RESULT diagonal 0.998, G_lo 0.621/0.455/0.289, nulls vanish -> SUPPORTED (AC1_IDENTIFIABLE)."
    preregistration: experiments/wp5_adaptive_compute/PREREGISTRATION.md
    status: SUPPORTED
    claim_id: CWC-AC1-compute-identifiability

  - hypothesis_id: H-AC2
    research_question_id: RQ-adaptive-compute
    type: confirmatory
    H0: "A reward-only controller cannot recover the oracle compute-allocation out-of-sample."
    H1: "A reward-only controller recovers K=d out-of-sample (>=0.8 recovery)."
    estimand: "held-out recovery of a REINFORCE pi(K|d) controller"
    experimental_unit: "controller seed"
    decision_rule: "reject H0 iff worst-of-8 recovery>=0.8 AND null<=0.1 AND random<best_fixed. RESULT recovery 1.000, null 0.000 -> SUPPORTED (AC2_CONTROLLER_RECOVERS)."
    preregistration: experiments/wp5_adaptive_compute/PREREGISTRATION_CONTROLLER.md
    status: SUPPORTED
    claim_id: CWC-AC2-compute-controller

  - hypothesis_id: H-AC3
    research_question_id: RQ-adaptive-compute
    type: confirmatory
    H0: "The compute-controller's value is independent of difficulty information I(C;Z)."
    H1: "Its value is bounded by and decreases with lower I(C;Z), vanishing when difficulty cannot be inferred."
    estimand: "held-out recovery vs I(C;Z) under a noisy difficulty channel"
    experimental_unit: "controller seed"
    decision_rule: "reject H0 iff rec(0)>=0.9, monotone in I, rec(I~0)<=0.15, controller abstains. RESULT recovery 1.0->0.0 monotone, abstains -> SUPPORTED (AC3_BOUNDARY_MAPPED)."
    preregistration: experiments/wp5_adaptive_compute/PREREGISTRATION_INFERRED.md
    status: SUPPORTED
    claim_id: CWC-AC3-inferred-difficulty

  - hypothesis_id: H-AC4
    research_question_id: RQ-adaptive-compute
    type: confirmatory
    H0: "The compute-controller's value exceeds V*(I) or is far below it even at high information."
    H1: "V_gov <= V*(I) everywhere and near-saturates at high information (>=0.90 for I>=1 bit)."
    estimand: "compute-controller realised value vs V*(I) across information levels"
    experimental_unit: "information level"
    decision_rule: "reject H0 iff ceiling holds at every level AND high-info saturation >=0.90. RESULT ceiling holds, high-info sat 0.971 -> SUPPORTED (AC4_RATE_BRIDGE_CONFIRMED); low-info sat 0.326 documented (committed != RI)."
    preregistration: experiments/wp5_adaptive_compute/PREREGISTRATION_RATEBRIDGE.md
    status: SUPPORTED
    claim_id: CWC-AC4-rate-bridge

  - hypothesis_id: H-RD1
    research_question_id: RQ-real-data
    type: confirmatory
    H0: "The clean synthetic adaptive-compute identifiability does not transfer to real LM per-token difficulty."
    H1: "It transfers: an oracle per-difficulty compute allocation is identifiable (G_lo>0) on real data."
    estimand: "certificate G_lo on real-LM per-difficulty compute utility, with a synthetic positive control"
    experimental_unit: "model seed"
    decision_rule: "reject H0 iff real G_lo>0 at some lambda AND positive control>0. RESULT real G_lo=-0.090 all lambda, positive control +0.621 -> FAIL to reject H0 (WP6_REAL_LM_NOT_IDENTIFIABLE). The interaction is a synthetic-benchmark property."
    preregistration: experiments/wp6_real_lm/PREREGISTRATION.md
    status: NOT_SUPPORTED
    claim_id: CWC-RD1-real-lm-boundary

  - hypothesis_id: H-RIGOR1
    research_question_id: RQ-rigor
    type: confirmatory
    H0: "The corrected certificate bound is invalid (FPR>delta) or a positive fails to survive it."
    H1: "The corrected proof-complete bound holds FPR<=delta and every positive survives it."
    estimand: "corrected-bound FPR on null families + G_lo_corrected of the certificate positives"
    experimental_unit: "null family / claim"
    decision_rule: "reject H0 iff corrected FPR<=delta on all nulls AND all positives G_lo_corrected>0. RESULT FPR=0.000, L4 0.060>0, AC1 0.620>0 -> SUPPORTED (WP7_GAP_CLOSED_POSITIVES_ROBUST)."
    preregistration: experiments/wp7_certificate_hardening/PREREGISTRATION.md
    status: SUPPORTED
    claim_id: CWC-RIGOR1-certificate

  - hypothesis_id: H-RIGOR2
    research_question_id: RQ-rigor
    type: confirmatory
    H0: "A SUPPORTED certificate positive fails under family-wise multiplicity correction."
    H1: "All certificate positives survive Bonferroni + Holm on top of the proof-complete bound (family-wise FPR<=0.05)."
    estimand: "G_lo_corrected of the certificate positives at Bonferroni/Holm-adjusted delta"
    experimental_unit: "claim"
    decision_rule: "reject H0 iff all survive Bonferroni-family AND Holm. RESULT L4 +0.053/+0.029, AC1 +0.619, all survive incl all-29 -> SUPPORTED (WP8_FWER_CONTROLLED)."
    preregistration: experiments/wp8_family_wise_error/PREREGISTRATION.md
    status: SUPPORTED
    claim_id: CWC-RIGOR2-fwer

  - hypothesis_id: H-fractal
    research_question_id: RQ-multiscale
    type: confirmatory
    H0: "No emergent multiscale/fractal organization (null)."
    H1: "Emergent multiscale/fractal organization."
    estimand: "fractal report vs null gate"
    experimental_unit: "run"
    decision_rule: "SUPPORTED iff null rejected; result NOT_SUPPORTED (insufficient evidence)"
    preregistration: artifacts/history/fractal/
    status: NOT_SUPPORTED
    claim_id: CWC-fractal

  - hypothesis_id: H-L7
    research_question_id: RQ-pareto
    type: confirmatory
    H0: "CWC does not Pareto-dominate MoD/MoE at equal budget on real workloads."
    H1: "CWC Pareto-dominates MoD/MoE at equal budget on >=2 real workloads."
    estimand: "compute-equivalent Pareto dominance vector"
    experimental_unit: "system x seed x scale"
    decision_rule: "SUPPORTED iff CWC dominates on the primary vector with CI support"
    preregistration: PENDING
    status: NOT_TESTED
    claim_id: CWC-L7-pareto

  - hypothesis_id: H-L8
    research_question_id: RQ-replication
    type: confirmatory
    H0: "An independent operator cannot reproduce the primary result."
    H1: "An independent operator reproduces the primary result within tolerance."
    estimand: "independent reproduction of the primary verdict"
    experimental_unit: "independent replication run"
    decision_rule: "SUPPORTED iff independent operator matches primary conclusion"
    preregistration: docs/risk/EXTERNAL_REVIEW_AND_INDEPENDENCE_PROTOCOL.md
    status: NOT_TESTED
    claim_id: CWC-L8-replication

  - hypothesis_id: H-RIGOR3
    research_question_id: RQ-rigor
    type: confirmatory
    H0: "The small-rate dichotomy holds only on curated instances."
    H1: "It holds over a random sample: regular exponent ~1, critical ~0.5."
    estimand: "small-rate exponent of V*(R) over random regular and constructed critical instances"
    experimental_unit: "utility instance"
    decision_rule: "reject H0 iff regular mean in [0.85,1.15] (>=80% in band) AND critical mean in [0.40,0.65] (>=90%). RESULT regular 0.948, critical 0.530 -> SUPPORTED (PINSKER_DICHOTOMY_CERTIFIED)."
    preregistration: experiments/wp11_pinsker/PREREGISTRATION.md
    status: SUPPORTED
    claim_id: CWC-RIGOR3-pinsker

  - hypothesis_id: H-RIGOR4
    research_question_id: RQ-rigor
    type: confirmatory
    H0: "A recorded status disagrees with its certificate sign recomputed from real artifacts."
    H1: "Every status agrees with its real-artifact certificate sign (both directions)."
    estimand: "status_positive == (G_lo_from_real_artifact > 0) across certificate-computable claims"
    experimental_unit: "claim"
    decision_rule: "reject H0 iff 0 contradictions. RESULT 0 (L4/AC1 positive, RD1 negative) -> SUPPORTED."
    preregistration: experiments/wp10_coherence/PREREGISTRATION.md
    status: SUPPORTED
    claim_id: CWC-RIGOR4-coherence

  - hypothesis_id: H-RIGOR5
    research_question_id: RQ-rigor
    type: confirmatory
    H0: "The corrected bound's coverage breaks (FPR>delta) under cross-context correlation."
    H1: "Coverage holds (FPR<=delta) up to rho=0.9; independence is not load-bearing."
    estimand: "corrected-bound FPR on a tied null vs correlation rho"
    experimental_unit: "shape x rho cell"
    decision_rule: "reject H0 iff FPR<=delta at every rho up to 0.9. RESULT max FPR 0.000 -> SUPPORTED."
    preregistration: experiments/wp9_independence/PREREGISTRATION.md
    status: SUPPORTED
    claim_id: CWC-RIGOR5-independence

  - hypothesis_id: H-RIGOR6
    research_question_id: RQ-rigor
    type: confirmatory
    H0: "A certificate positive's bootstrap 95% CI includes zero."
    H1: "Both positives' bootstrap 95% CI lower bounds are > 0 and n_seeds >= n*."
    estimand: "seed-bootstrap 95% CI of the oracle gap + sample complexity"
    experimental_unit: "claim"
    decision_rule: "reject H0 iff both CI lower bounds >0. RESULT L4 [0.191,0.191], AC1 [0.623,0.625] -> SUPPORTED."
    preregistration: experiments/wp13_effect_size/PREREGISTRATION.md
    status: SUPPORTED
    claim_id: CWC-RIGOR6-effect-size

  - hypothesis_id: H-RIGOR7
    research_question_id: RQ-rigor
    type: confirmatory
    H0: "Some experiment has an undisclosed prereg-after-results (HARKing) ordering."
    H1: "Every prereg is strict-ancestor of its results, except disclosed retrospective cases."
    estimand: "git-ancestry classification of prereg vs results commit per experiment"
    experimental_unit: "experiment"
    decision_rule: "reject H0 iff 0 undisclosed same-commit or result-before-prereg. RESULT 14 strict-ancestor, 4 disclosed, 0 violations -> SUPPORTED."
    preregistration: experiments/wp12_prereg_integrity/PREREGISTRATION.md
    status: SUPPORTED
    claim_id: CWC-RIGOR7-prereg-integrity

