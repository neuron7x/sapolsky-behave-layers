[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cwc-fractal-multiscale"
version = "0.1.0"
description = "Separate fractal multiscale diagnostics layer for Cognitive Wiring Core research"
requires-python = ">=3.11"
authors = [{name = "Yaroslav Vasylenko"}]
license = {text = "Apache-2.0"}
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cwc_fractal"]
