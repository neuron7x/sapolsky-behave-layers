# WP-2 Routing v1 — frozen protocol. Committed before Phase D.
task:
  name: in_context_associative_recall
  vocab_size: 64
  seq_len: 128
  n_pairs: 24          # (key,value) pairs before the query
  key_range: [4, 34]   # 30 possible keys
  value_range: [34, 64] # 30 possible values
  query_token: 1
  pad_token: 0
  val_sequences: 2000

model:
  n_layer: 8            # L
  d_model: 128
  n_head: 4
  d_ff: 512
  budget_K: 4           # active blocks per sequence (Act D3 hard budget)

controller:
  mechanism: straight_through_topk   # ADR-0002; ONE mechanism (Act D4)
  input: [pooled_hidden, norm_layer_index, remaining_budget]
  deterministic_inference: true

training:
  steps: 3000
  batch_size: 64
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.01
  warmup_steps: 100
  grad_clip: 1.0
  eval_every: 500
  checkpoint_selection: min_val_query_ce
  identical_token_budget_across_configs: true

configs: [dense, random, frozen, learned, fixed_depth]

seeds:
  pilot: [0, 1, 2]
  claim_min: 5

compute_parity:
  tolerance: 0.01
  count_controller_flops: true
  matched_set: [random, frozen, learned, fixed_depth]   # dense excluded (full L)

energy:
  status: EXCLUDED
  reason: INSTRUMENT_INVALID (NVML counter ~2x over-read, WP1_L2 probe)
