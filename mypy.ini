; CWC WP-1 strict type checking, scoped to the cwc/ package.
; Invoke: .venv/bin/python -m mypy --config-file mypy.ini cwc/
[mypy]
python_version = 3.10
strict = True
warn_unused_ignores = True
warn_redundant_casts = True
disallow_any_generics = True
; torch ships partial/no stubs for cuda.Event etc.; pynvml has none. These are
; the only two external libraries this package touches at runtime, and both are
; optional-import-guarded, so untyped calls into them are unavoidable and are
; annotated in-line with targeted `type: ignore[...]` rather than blanket-ignored.
[mypy-torch.*]
ignore_missing_imports = True
follow_imports = skip
[mypy-pynvml]
ignore_missing_imports = True
; pyarrow (lazy-imported by governance/external_materialization.py) ships no
; py.typed marker and is absent from the CI tooling env; same treatment as above.
[mypy-pyarrow.*]
ignore_missing_imports = True
; Evidence-frozen source: research/results/CSCA-03R/SHA256SUMS pins these exact bytes
; (enforced by scripts/csca03r_gate.py), so annotating the three empty-dict locals would
; break the CSCA-03R provenance chain. Only this one error code is waived, only here.
[mypy-cwc.credit.budgeted_shapley]
disable_error_code = var-annotated
