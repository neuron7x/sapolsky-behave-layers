name: CWC evidence levels source pin
on:
  pull_request:
    paths:
      - '.github/workflows/cwc-evidence-levels.yml'
permissions:
  contents: read
jobs:
  source-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Acquire UCI source bytes without evaluating policies
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            'https://archive.ics.uci.edu/static/public/70/monk+s+problems.zip' \
            -o "$RUNNER_TEMP/monks.zip"
          sha256sum "$RUNNER_TEMP/monks.zip"
          unzip -Z1 "$RUNNER_TEMP/monks.zip"
