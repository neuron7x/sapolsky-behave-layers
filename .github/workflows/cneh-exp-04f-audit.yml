name: CNEH-EXP-04F failure decomposition
on:
  pull_request:
    paths:
      - 'experiments/cneh_exp_04f_audit/**'
      - 'tests/test_cneh_exp_04f_audit.py'
      - '.github/workflows/cneh-exp-04f-audit.yml'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  sealed-model-control-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate frozen protocol and integrated parent
        run: |
          git merge-base --is-ancestor 18b854b110306f98287ba01828c583405e217613 HEAD
          git show 18b854b110306f98287ba01828c583405e217613:experiments/cneh_exp_04f_audit/PROTOCOL.md | cmp - experiments/cneh_exp_04f_audit/PROTOCOL.md
          git diff --exit-code d8a2196fb761ed5a6031e2c58b3ca14e1cf35567 HEAD -- experiments/cneh_exp_04f experiments/cneh_exp_04e experiments/cneh_exp_04d experiments/cneh_exp_04c experiments/cneh_exp_04b experiments/cneh_exp_03 experiments/cneh_exp_01
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Qualify failure decomposition
        run: python -m unittest discover -s tests -p test_cneh_exp_04f_audit.py -v
      - name: Download exact sealed historical artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/neuron7x/sapolsky-behave-layers/actions/artifacts/14862927917/zip" --output /tmp/cneh04f.zip
          echo '0605472076bf67b86dc3db804a2d05dd1866e0f7652f0949ef72e51df7b749ae  /tmp/cneh04f.zip' | sha256sum --strict -c -
      - name: Decompose and independently replay all archived traces
        run: |
          python -m experiments.cneh_exp_04f_audit.audit --archive /tmp/cneh04f.zip --out /tmp/cneh04f-audit.json
          python -m experiments.cneh_exp_04f_audit.audit --archive /tmp/cneh04f.zip --out /tmp/cneh04f-audit.json --verify
          (cd /tmp && sha256sum cneh04f-audit.json > cneh04f-audit.sha256)
      - name: Preserve deterministic diagnostic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh-exp-04f-failure-decomposition-SHA256
          path: |
            /tmp/cneh04f-audit.json
            /tmp/cneh04f-audit.sha256
          if-no-files-found: error
          retention-days: 90
