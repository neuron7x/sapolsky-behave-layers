name: CNEH-EXP-04 active causal reidentification
on:
  pull_request:
    paths:
      - 'experiments/cneh_exp_04/**'
      - 'tests/test_cneh_exp_04.py'
      - '.github/workflows/cneh-exp-04.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  finite-family-reidentification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify frozen prospective protocol
        run: git show a5bd7609308946529fb0dcb3c7691572770a2ec6:experiments/cneh_exp_04/PREREGISTRATION.md | cmp - experiments/cneh_exp_04/PREREGISTRATION.md
      - name: Mathematical and behavioral falsifiers
        run: python -m unittest discover -s tests -p test_cneh_exp_04.py -v
      - name: Execute paired hidden structural OOD and no-change worlds
        run: python -m experiments.cneh_exp_04.run --out /tmp/cneh04
      - name: Full fresh replay and strict evidence manifest
        run: |
          python -m experiments.cneh_exp_04.run --out /tmp/cneh04 --verify
          (cd /tmp/cneh04 && sha256sum --strict -c SHA256SUMS)
      - name: Archive complete internal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh-exp-04-finite-family-${{ matrix.python }}
          path: /tmp/cneh04/
          if-no-files-found: error
          retention-days: 90
