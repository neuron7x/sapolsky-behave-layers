name: CNEH-EXP-05I causal action-time identifiability
on:
  pull_request:
    paths:
      - 'experiments/cneh_exp_05i/**'
      - 'tests/test_cneh_exp_05i.py'
      - '.github/workflows/cneh-exp-05i.yml'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  causal-support:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate frozen protocol and evidence-governance parent
        run: |
          git merge-base --is-ancestor a3b9f7b21832d1d8e513046e5b5ad0e960052e3c HEAD
          git show a3b9f7b21832d1d8e513046e5b5ad0e960052e3c:experiments/cneh_exp_05i/PROTOCOL.md | cmp - experiments/cneh_exp_05i/PROTOCOL.md
          git merge-base --is-ancestor b285050998ee4f4284708d41fb385c6396f0876d HEAD
          git diff --exit-code b285050998ee4f4284708d41fb385c6396f0876d HEAD -- scripts/cneh_evidence_admission.py scripts/cneh_promotion_gate.py
          git diff --exit-code 8cd266c51d9b0ae495e42557dd5da2d5a443dbbd HEAD -- experiments/cneh_exp_05 experiments/cneh_exp_04g experiments/cneh_exp_04f_audit experiments/cneh_exp_04f experiments/cneh_exp_04e experiments/cneh_exp_04d experiments/cneh_exp_04c experiments/cneh_exp_04b experiments/cneh_exp_03 experiments/cneh_exp_01
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exhaustive discrete support and independent path falsifiers
        run: python -m unittest discover -s tests -p test_cneh_exp_05i.py -v
      - name: Download authenticated sealed archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/neuron7x/sapolsky-behave-layers/actions/artifacts/14890028886/zip" --output /tmp/cneh05.zip
          echo 'db78569d633a4fd1ae5649ab02e53a86b48e97f0317b45a849a56cd73e993ea8  /tmp/cneh05.zip' | sha256sum --strict -c -
      - name: Reconstruct causal support and alternative history witnesses
        run: python -m experiments.cneh_exp_05i.audit --archive /tmp/cneh05.zip --out /tmp/cneh05i
      - name: Fresh exact diagnostic replay and authority guard
        run: |
          python -m experiments.cneh_exp_05i.audit --archive /tmp/cneh05.zip --out /tmp/cneh05i --verify
          (cd /tmp/cneh05i && sha256sum --strict -c SHA256SUMS)
          python -m scripts.cneh_promotion_gate check-verdict --experiment CNEH-EXP-05I --verdict /tmp/cneh05i/report.json
      - name: Preserve complete causal evidence and witnesses
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh-exp-05i-causal-identifiability-SHA256
          path: /tmp/cneh05i/
          if-no-files-found: error
          retention-days: 90
