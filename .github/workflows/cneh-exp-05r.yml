name: CNEH-EXP-05R numerical execution-domain qualification
on:
  pull_request:
    paths:
      - 'experiments/cneh_exp_05r/**'
      - 'tests/test_cneh_exp_05r.py'
      - '.github/workflows/cneh-exp-05r.yml'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  workers:
    name: Numerical worker ${{ matrix.worker }}
    strategy:
      fail-fast: false
      matrix:
        worker: [A, B]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BNSYN_USE_TORCH: '0'
      WORKER: ${{ matrix.worker }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen diagnostic and parent
        run: |
          git merge-base --is-ancestor 50895f66d6ec7dfcc0ffe36af621f1c6b6f4335c HEAD
          git show 50895f66d6ec7dfcc0ffe36af621f1c6b6f4335c:experiments/cneh_exp_05r/PROTOCOL.md | cmp - experiments/cneh_exp_05r/PROTOCOL.md
          git diff --exit-code 8cd266c51d9b0ae495e42557dd5da2d5a443dbbd HEAD -- experiments/cneh_exp_05 experiments/cneh_exp_04g experiments/cneh_exp_04f_audit experiments/cneh_exp_04f experiments/cneh_exp_04e experiments/cneh_exp_04d experiments/cneh_exp_04c experiments/cneh_exp_04b experiments/cneh_exp_03 experiments/cneh_exp_01
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: neuron7x/bnsyn-phase-controlled-emergent-dynamics
          ref: c1de425ce4ece362e7f2feb2d9f24da5d3231014
          path: .cneh-inputs/bnsyn
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install frozen runtime
        run: |
          python -m venv /tmp/cneh05r-env
          /tmp/cneh05r-env/bin/python -m pip install --require-hashes --only-binary=:all: -r experiments/cneh_exp_01/bnsyn-requirements.lock
          /tmp/cneh05r-env/bin/python -m unittest discover -s tests -p test_cneh_exp_05r.py -v
      - name: Download sealed reference archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/neuron7x/sapolsky-behave-layers/actions/artifacts/14890028886/zip" --output /tmp/cneh05.zip
          echo 'db78569d633a4fd1ae5649ab02e53a86b48e97f0317b45a849a56cd73e993ea8  /tmp/cneh05.zip' | sha256sum --strict -c -
      - name: Default dispatch native and passive repeated panel
        run: |
          env -u NPY_DISABLE_CPU_FEATURES /tmp/cneh05r-env/bin/python -m experiments.cneh_exp_05r.run --archive /tmp/cneh05.zip --source .cneh-inputs/bnsyn --worker "$WORKER" --profile DEFAULT --out /tmp/cneh05r-default
      - name: Baseline dispatch independent process panel
        if: always()
        run: |
          DISABLE=$(env -u NPY_DISABLE_CPU_FEATURES /tmp/cneh05r-env/bin/python -c 'import numpy as np; from experiments.cneh_exp_05r.run import optional_features; print(",".join(optional_features(np)))')
          NPY_DISABLE_CPU_FEATURES="$DISABLE" /tmp/cneh05r-env/bin/python -m experiments.cneh_exp_05r.run --archive /tmp/cneh05.zip --source .cneh-inputs/bnsyn --worker "$WORKER" --profile BASELINE --out /tmp/cneh05r-baseline
      - name: Preserve default profile evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh-exp-05r-${{ matrix.worker }}-DEFAULT
          path: /tmp/cneh05r-default/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve baseline profile evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh-exp-05r-${{ matrix.worker }}-BASELINE
          path: /tmp/cneh05r-baseline/
          if-no-files-found: error
          retention-days: 90
  aggregate:
    needs: workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retrieve exact same-run profiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'cneh-exp-05r-*-*' --dir /tmp/profiles
      - name: Compare numerical domains and replay aggregate
        run: |
          python -m experiments.cneh_exp_05r.run --profiles /tmp/profiles --out /tmp/cneh05r
          python -m experiments.cneh_exp_05r.run --profiles /tmp/profiles --out /tmp/cneh05r --verify
          (cd /tmp/cneh05r && sha256sum --strict -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh-exp-05r-aggregate
          path: /tmp/cneh05r/
          if-no-files-found: error
          retention-days: 90
