name: CNEH-EXP-05M sealed multiscale temporal evidence
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  multiscale:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate frozen diagnostic protocol and parents
        run: |
          git merge-base --is-ancestor 1e6d0455172820a9bcde1be70e041c512e313eea HEAD
          git show 1e6d0455172820a9bcde1be70e041c512e313eea:experiments/cneh_exp_05m/PROTOCOL.md | cmp - experiments/cneh_exp_05m/PROTOCOL.md
          git diff --exit-code 8cd266c51d9b0ae495e42557dd5da2d5a443dbbd HEAD -- experiments/cneh_exp_05 experiments/cneh_exp_04g experiments/cneh_exp_04f_audit experiments/cneh_exp_04f experiments/cneh_exp_04e experiments/cneh_exp_04d experiments/cneh_exp_04c experiments/cneh_exp_04b experiments/cneh_exp_03 experiments/cneh_exp_01
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Qualify semantic scale tests
        run: |
          python -m unittest discover -s tests -p test_cneh_exp_05m.py -v
      - name: Download authenticated historical EXP05 archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/neuron7x/sapolsky-behave-layers/actions/artifacts/14890028886/zip" --output /tmp/cneh05.zip
          echo 'db78569d633a4fd1ae5649ab02e53a86b48e97f0317b45a849a56cd73e993ea8  /tmp/cneh05.zip' | sha256sum --strict -c -
      - name: Reduce all archived worlds across scales and phases
        run: python -m experiments.cneh_exp_05m.audit --archive /tmp/cneh05.zip --out /tmp/cneh05m
      - name: Fresh byte-identical replay
        run: |
          python -m experiments.cneh_exp_05m.audit --archive /tmp/cneh05.zip --out /tmp/cneh05m --verify
          (cd /tmp/cneh05m && sha256sum --strict -c SHA256SUMS)
      - name: Preserve multiscale evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh-exp-05m-multiscale-SHA256
          path: /tmp/cneh05m/
          if-no-files-found: error
          retention-days: 90
