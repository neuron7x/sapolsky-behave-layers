name: cwc-quality

# Reference-grade quality gate for the CWC WP-1 instrumentation subsystem only.
# Scoped by path so it never runs on unrelated nanochat changes, and never
# lints/typechecks nanochat's own (deliberately unlinted) source.
permissions:
  contents: read

on:
  push:
    paths:
      - "cwc/**"
      - "scripts/instrumentation_*.py"
      - "scripts/export_cwc_instrumentation_bundle.py"
      - "scripts/mutation_probe.py"
      - "tests/test_instrumentation_*.py"
      - "tests/test_mutation_kill_rate.py"
      - "experiments/**"
      - "ruff.toml"
      - "mypy.ini"
      - "cwc-requirements-dev.txt"
      - "Makefile.cwc"
      - ".github/workflows/cwc-quality.yml"
  pull_request:
    paths:
      - "cwc/**"
      - "scripts/instrumentation_*.py"
      - "scripts/export_cwc_instrumentation_bundle.py"
      - "scripts/mutation_probe.py"
      - "tests/test_instrumentation_*.py"
      - "tests/test_mutation_kill_rate.py"
      - "experiments/**"
      - "ruff.toml"
      - "mypy.ini"
      - "cwc-requirements-dev.txt"
      - "Makefile.cwc"
      - ".github/workflows/cwc-quality.yml"

concurrency:
  group: cwc-quality-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: cwc-requirements-dev.txt
      - name: Install CWC dev tooling (no torch needed for the pure-logic gates)
        run: |
          python -m pip install --upgrade pip
          pip install -r cwc-requirements-dev.txt

      # torch/pynvml are optional here: the CUDA-marked and torch-importing
      # tests skip on a CPU runner, and ruff/mypy target only pure-Python CWC
      # code. The gate below is the CPU-portable subset.
      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Type check (mypy --strict, cwc package)
        run: python -m mypy --config-file mypy.ini cwc/

      - name: Tests + branch coverage (CPU-portable floor; full 99.46% is a GPU-host artifact)
        run: |
          python -m pytest -q -m "not slow and not mutation and not cuda" \
            tests/test_instrumentation_*.py \
            --cov=cwc/instrumentation --cov-branch --cov-report=term-missing --cov-fail-under=85

      - name: Mutation kill-rate gate (100% over mathematical cores)
        run: python scripts/mutation_probe.py
