name: CNEH-EXP-05H hybrid physical-time convergence
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  episodes:
    name: Hybrid reference episode ${{ matrix.index }}
    strategy:
      fail-fast: false
      matrix:
        index: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      INDEX: ${{ matrix.index }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen protocol and parent
        run: |
          git merge-base --is-ancestor 5f643402038c6a4a9b53010d38980b1ece271d9a HEAD
          git show 5f643402038c6a4a9b53010d38980b1ece271d9a:experiments/cneh_exp_05h/PROTOCOL.md | cmp - experiments/cneh_exp_05h/PROTOCOL.md
          git diff --exit-code fcee15741f55aa8288a82662ee73d68fc4ac79d9 HEAD -- experiments/cneh_exp_05v experiments/cneh_exp_05d experiments/cneh_exp_05t experiments/cneh_exp_05n experiments/cneh_exp_05 experiments/cneh_exp_04g scripts/cneh_promotion_gate.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Install frozen numerical dependencies and retrieve sealed panel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m venv /tmp/h-env
          /tmp/h-env/bin/python -m pip install --require-hashes --only-binary=:all: -r experiments/cneh_exp_01/bnsyn-requirements.lock
          mkdir /tmp/archives
          for id in 14896119541 14897018650; do
            curl --fail --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/neuron7x/sapolsky-behave-layers/actions/artifacts/$id/zip" --output "/tmp/archives/$id.zip"
          done
      - name: Full six-grid and two-reference computation and fresh report replay
        run: |
          PY=/tmp/h-env/bin/python
          "$PY" -m experiments.cneh_exp_05h.run run --archives /tmp/archives --index "$INDEX" --out /tmp/h-result
          "$PY" -m experiments.cneh_exp_05h.run run --archives /tmp/archives --index "$INDEX" --out /tmp/h-result --verify
          "$PY" -m scripts.cneh_promotion_gate check-verdict --experiment CNEH-EXP-05H --verdict /tmp/h-result/report.json
          (cd /tmp/h-result && sha256sum --strict -c SHA256SUMS)
      - name: Preserve all grid and independent reference observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh-exp-05h-${{ matrix.index }}
          path: /tmp/h-result/
          if-no-files-found: error
          retention-days: 90
  aggregate:
    needs: episodes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Install locked numerical dependencies and retrieve same-run artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m venv /tmp/h-env
          /tmp/h-env/bin/python -m pip install --require-hashes --only-binary=:all: -r experiments/cneh_exp_01/bnsyn-requirements.lock
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'cneh-exp-05h-[0-7]' --dir /tmp/profiles
      - name: Complete roster, fail-closed verdict and exact report replay
        run: |
          set +e
          /tmp/h-env/bin/python -m experiments.cneh_exp_05h.run aggregate --profiles /tmp/profiles --out /tmp/h-aggregate
          first=$?
          /tmp/h-env/bin/python -m experiments.cneh_exp_05h.run aggregate --profiles /tmp/profiles --out /tmp/h-aggregate --verify
          second=$?
          set -e
          test "$first" = "$second"
          /tmp/h-env/bin/python -m scripts.cneh_promotion_gate check-verdict --experiment CNEH-EXP-05H --verdict /tmp/h-aggregate/report.json
          (cd /tmp/h-aggregate && sha256sum --strict -c SHA256SUMS)
          exit "$first"
      - name: Preserve complete finite verdict including negative outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh-exp-05h-aggregate
          path: /tmp/h-aggregate/
          if-no-files-found: error
          retention-days: 90
