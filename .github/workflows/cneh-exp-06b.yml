name: CNEH-EXP-06B native public observability falsification
on:
  pull_request:
    paths:
      - 'experiments/cneh_exp_06b/**'
      - 'tests/test_cneh_exp_06b_certificate.py'
      - '.github/workflows/cneh-exp-06b.yml'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  shards:
    name: Native ${{ matrix.arch }} ${{ matrix.shard }}
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        arch: [x86_64, aarch64]
        shard: [silent-0,silent-1,silent-2,silent-3,silent-4,silent-5,silent-6,silent-7,silent-8,gramian-0,gramian-1,gramian-2,active]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ARCH: ${{ matrix.arch }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate frozen protocol and unmodified numerical parent
        run: |
          git merge-base --is-ancestor 9884399882a95b89ccea0a54cb8c7ccc9bded456 HEAD
          git show 9884399882a95b89ccea0a54cb8c7ccc9bded456:experiments/cneh_exp_06b/PROTOCOL.md | cmp - experiments/cneh_exp_06b/PROTOCOL.md
          git diff --exit-code 38ccba89e3fe6d24c6f2dff5d3a4d2ff1de437d1 HEAD -- experiments/cneh_exp_01 'experiments/cneh_exp_05*' experiments/cneh_exp_06a scripts/cneh_promotion_gate.py scripts/cneh_exp05_integration.py
          test "$(uname -m)" = "$ARCH"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Exact rational theorem and negative mathematical tests
        run: python -m unittest discover -s tests -p test_cneh_exp_06b_certificate.py -v
      - name: Rebuild unchanged R1 MPFR arithmetic and retrieve sealed parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m venv /tmp/b-env
          /tmp/b-env/bin/python -m pip install --require-hashes --only-binary=:all: -r experiments/cneh_exp_01/bnsyn-requirements.lock --report /tmp/install.json
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libmpfr-dev binutils gcc
          bash experiments/cneh_exp_05y/build.sh
          mkdir /tmp/archives
          curl --fail --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/neuron7x/sapolsky-behave-layers/actions/artifacts/14912290707/zip" --output /tmp/archives/14912290707.zip
      - name: Execute every preregistered intervention and retain raw evidence
        run: |
          /tmp/b-env/bin/python -m experiments.cneh_exp_06b.run run --archives /tmp/archives --shard "$SHARD" --arch "$ARCH" --install /tmp/install.json --out /tmp/b-result
      - name: Preserve committed intervention evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cneh06b-${{ matrix.arch }}-${{ matrix.shard }}
          path: /tmp/b-result/
          if-no-files-found: error
          retention-days: 90
  aggregate:
    needs: shards
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Reconstruct all original receipts and authenticated parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m venv /tmp/b-env
          /tmp/b-env/bin/python -m pip install --require-hashes --only-binary=:all: -r experiments/cneh_exp_01/bnsyn-requirements.lock
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libmpfr-dev binutils gcc
          bash experiments/cneh_exp_05y/build.sh
          mkdir /tmp/archives
          curl --fail --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/neuron7x/sapolsky-behave-layers/actions/artifacts/14912290707/zip" --output /tmp/archives/14912290707.zip
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'cneh06b-*' --dir /tmp/profiles
      - name: Independent counterexample and native replay aggregation
        run: |
          set +e
          /tmp/b-env/bin/python -m experiments.cneh_exp_06b.run aggregate --profiles /tmp/profiles --archives /tmp/archives --head "$HEAD_SHA" --run-id "$GITHUB_RUN_ID" --out /tmp/b-aggregate
          status=$?
          set -e
          python -m scripts.cneh_promotion_gate check-verdict --experiment CNEH-EXP-06B --verdict /tmp/b-aggregate/report.json
          (cd /tmp/b-aggregate && sha256sum --strict -c SHA256SUMS)
          exit "$status"
      - name: Preserve scoped negative scientific result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cneh06b-aggregate
          path: /tmp/b-aggregate/
          if-no-files-found: error
          retention-days: 90
