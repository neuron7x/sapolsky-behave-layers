name: CNEH-EXP-06J conditional decision acquisition
on:
  pull_request:
    paths:
      - 'experiments/cneh_exp_06j/**'
      - 'tests/test_cneh_exp_06j.py'
      - '.github/workflows/cneh-exp-06j.yml'
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact base, frozen protocol and source preservation
        run: |
          test "$BASE_SHA" = "2511a31828c4547de5eefb9dc26231025180d1df"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = "$ARCH"
          git merge-base --is-ancestor "$HEAD_SHA" HEAD
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git merge-base --is-ancestor 210271f12f9604c04a7c7fa50d76f38d2ac53073 "$BASE_SHA"
          git diff --exit-code 210271f12f9604c04a7c7fa50d76f38d2ac53073 "$BASE_SHA" --
          git merge-base --is-ancestor b25f3b05d03f568ddc8c64fb170ecfcf70c9a527 HEAD
          git show b25f3b05d03f568ddc8c64fb170ecfcf70c9a527:experiments/cneh_exp_06j/PROTOCOL.md | cmp - experiments/cneh_exp_06j/PROTOCOL.md
          git diff --name-status "$BASE_SHA" HEAD | sort > /tmp/actual
          printf 'A\t%s\n' '.github/workflows/cneh-exp-06j.yml' 'experiments/cneh_exp_06j/PROTOCOL.md' 'experiments/cneh_exp_06j/kernel.py' 'experiments/cneh_exp_06j/panel.py' 'experiments/cneh_exp_06j/run.py' 'tests/test_cneh_exp_06j.py' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Authenticate sealed I aggregate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/neuron7x/sapolsky-behave-layers/actions/artifacts/14972556331/zip" --output /tmp/parent.zip
          echo '5941cb26ddfb49792199768eedd8d44be64e548dcde0d55c6fb16e64aa81ac3c  /tmp/parent.zip' | sha256sum --strict -c -
      - name: Independent exact oracle and mutation probes
        run: python -m unittest discover -s tests -p test_cneh_exp_06j.py -v
      - name: Complete frozen panel and independent optimized replay
        id: panel
        run: |
          PRIMARY_RC=0
          REPLAY_RC=0
          PYTHONHASHSEED=0 timeout --kill-after=5s 480s python -m experiments.cneh_exp_06j.run native --arch "$ARCH" --head "$HEAD_SHA" --base "$BASE_SHA" --checkout "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --parent /tmp/parent.zip --out /tmp/panel/primary || PRIMARY_RC=$?
          PYTHONHASHSEED=2147483647 timeout --kill-after=5s 480s python -O -m experiments.cneh_exp_06j.run native --arch "$ARCH" --head "$HEAD_SHA" --base "$BASE_SHA" --checkout "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --parent /tmp/parent.zip --out /tmp/panel/replay || REPLAY_RC=$?
          printf 'primary_exit=%s replay_exit=%s\n' "$PRIMARY_RC" "$REPLAY_RC"
          test "$PRIMARY_RC" -eq 0
          test "$REPLAY_RC" -eq 0
          cmp /tmp/panel/primary/payload.json /tmp/panel/replay/payload.json
          cmp /tmp/panel/primary/receipt.json /tmp/panel/replay/receipt.json
          sha256sum /tmp/panel/primary/payload.json /tmp/panel/replay/payload.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && steps.panel.outcome != 'skipped' }}
        with:
          name: cneh06j-${{ matrix.arch }}-attempt-${{ github.run_attempt }}
          path: /tmp/panel/
          if-no-files-found: error
          retention-days: 90
  aggregate:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Retrieve exact-attempt native evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$BASE_SHA" = "2511a31828c4547de5eefb9dc26231025180d1df"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          curl --fail --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/neuron7x/sapolsky-behave-layers/actions/artifacts/14972556331/zip" --output /tmp/parent.zip
          for arch in aarch64 x86_64; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "cneh06j-$arch-attempt-$GITHUB_RUN_ATTEMPT" --dir "/tmp/profiles/cneh06j-$arch"
          done
      - name: Independently reconstruct and enforce blocked scientific admission
        run: |
          timeout --kill-after=5s 480s python -m experiments.cneh_exp_06j.run aggregate --parent /tmp/parent.zip --profiles /tmp/profiles --head "$HEAD_SHA" --base "$BASE_SHA" --checkout "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --out /tmp/aggregate
          python -m scripts.cneh_promotion_gate check-verdict --experiment CNEH-EXP-06J --verdict /tmp/aggregate/report.json
          (cd /tmp/aggregate && sha256sum --strict -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh06j-aggregate-attempt-${{ github.run_attempt }}
          path: /tmp/aggregate
          if-no-files-found: error
          retention-days: 90
