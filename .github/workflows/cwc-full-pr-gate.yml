name: cwc-full-pr-gate

# Final PR admission gate. This intentionally runs the same canonical command
# used by a local researcher: verification, validation, mutation falsification,
# experiment suites, evidence checks, bibliography, and document traceability.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cwc-full-pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-verification:
    name: Full verification, validation, and falsification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: cwc-requirements-dev.txt
      - name: Install uv
        run: pipx install uv==0.10.12
      - name: Build the locked CPU environment
        run: |
          uv sync --frozen --extra cpu
          VIRTUAL_ENV=.venv uv pip install -r cwc-requirements-dev.txt
      - name: Run the canonical expert gate
        run: make -f Makefile.cwc pr-full

  fractal-verification:
    name: Fractal multiscale verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            experiments/fractal_multiscale/pyproject.toml
            experiments/fractal_multiscale/uv.lock
      - name: Install uv
        run: pipx install uv==0.10.12
      - name: Build the isolated frozen fractal environment
        run: uv sync --frozen --project experiments/fractal_multiscale --extra dev
      - name: Run its independent lint, type, protocol, and test gates
        run: uv run --frozen --project experiments/fractal_multiscale make -C experiments/fractal_multiscale verify
