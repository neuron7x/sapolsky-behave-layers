name: cwc-full-pr-gate
on:
  pull_request:
    branches: [assurance/eqa-policy-probe-base]
permissions:
  contents: read
jobs:
  integration-acceptance:
    name: CWC integration acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Deliberate rejection control on isolated test branch
        run: exit 1
  full-verification:
    name: Full verification, validation, and falsification
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Deliberate rejection control for the existing main check
        run: exit 1
