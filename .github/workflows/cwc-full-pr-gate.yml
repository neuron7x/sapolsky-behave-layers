name: cwc-full-pr-gate

# Final PR admission gate. This intentionally runs the same canonical command
# used by a local researcher: verification, validation, mutation falsification,
# experiment suites, evidence checks, bibliography, and document traceability.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cwc-full-pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cneh-promotion-invariants:
    name: CNEH fail-closed scientific promotion invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: Verify promotion invariants and negative controls
        run: |
          python -B -m unittest discover -s tests -p 'test_cneh_promotion*.py' -v
          python -m scripts.cneh_promotion_gate audit

  cneh-promotion-adversarial:
    name: CNEH adversarial campaign ${{ matrix.round }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - round: 1
            python: "3.11"
            seed: 113
          - round: 2
            python: "3.12"
            seed: 127
          - round: 3
            python: "3.13"
            seed: 131
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Attack previously green implementation and every fault mutant
        run: |
          python -B -m scripts.cneh_promotion_attack campaign --seed "${{ matrix.seed }}" --out /tmp/cneh-promotion-attack.json
          (cd /tmp && sha256sum cneh-promotion-attack.json > cneh-promotion-attack.sha256)
      - name: Preserve complete attack receipts even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh-promotion-adversarial-round-${{ matrix.round }}
          path: |
            /tmp/cneh-promotion-attack.json
            /tmp/cneh-promotion-attack.sha256
          if-no-files-found: error
          retention-days: 90

  full-verification:
    name: Full verification, validation, and falsification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements/ci-uv.lock
            requirements/cwc-dev.lock
      - name: Install uv
        run: |
          python -m pip install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r requirements/ci-uv.lock
          uv --version
      - name: Build the locked CPU environment
        run: |
          uv sync --frozen --extra cpu
          uv pip install --python .venv/bin/python --require-hashes --only-binary :all: --default-index https://pypi.org/simple -r requirements/cwc-dev.lock
      - name: Run the canonical expert gate
        # Hosted runners have no CUDA/NVML: use the documented CPU floor (Makefile.cwc coverage).
        run: make -f Makefile.cwc pr-full COVERAGE_FAIL_UNDER=91

  fractal-verification:
    name: Fractal multiscale verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            experiments/fractal_multiscale/pyproject.toml
            experiments/fractal_multiscale/uv.lock
      - name: Install uv
        run: |
          python -m pip install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r requirements/ci-uv.lock
          uv --version
      - name: Build the isolated frozen fractal environment
        run: uv sync --frozen --project experiments/fractal_multiscale --extra dev
      - name: Run its independent lint, type, protocol, and test gates
        run: uv run --frozen --project experiments/fractal_multiscale make -C experiments/fractal_multiscale verify

  integration-acceptance:
    name: CWC integration acceptance
    if: always()
    needs: [cneh-promotion-invariants, cneh-promotion-adversarial, full-verification, fractal-verification]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: Test the admission predicate
        id: admission-tests
        run: python -B -m unittest discover -s tests -p test_eqa_integration_gate.py -v
      - name: Bind job results to the actual source checkout
        if: always()
        env:
          CWC_REQUIRED_JOB_RESULTS: ${{ toJSON(needs) }}
          CWC_GATE_SELF_TEST_RESULT: ${{ steps.admission-tests.outcome }}
        run: python -B scripts/eqa_integration_gate.py --output "$RUNNER_TEMP/cwc-integration-receipt.json"
      - name: Preserve the integration receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cwc-integration-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cwc-integration-receipt.json
          if-no-files-found: error
