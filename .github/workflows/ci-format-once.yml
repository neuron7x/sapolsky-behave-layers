# Temporary self-deleting maintenance action, restricted to this recovery branch.
name: Temporary targeted syntax formatting
on:
  push:
    branches:
      - ci/verified-recovery-20261020
    paths:
      - .github/workflows/ci-format-once.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'neuron7x/sapolsky-behave-layers' && github.ref == 'refs/heads/ci/verified-recovery-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install exact repository-pinned formatter
        run: python -m pip install --disable-pip-version-check ruff==0.15.21
      - name: Normalize only seven verified E701/E702 source files
        run: |
          python -m ruff format \
            cwc/governance/bounded_meta_planner.py \
            cwc/governance/calibration_lifecycle.py \
            cwc/governance/causal_transport.py \
            cwc/governance/drift_sensitivity.py \
            cwc/governance/metareasoning_branch_bound.py \
            cwc/governance/sequential_risk_control.py \
            cwc/governance/statistical_authority.py
          python -m compileall -q \
            cwc/governance/bounded_meta_planner.py \
            cwc/governance/calibration_lifecycle.py \
            cwc/governance/causal_transport.py \
            cwc/governance/drift_sensitivity.py \
            cwc/governance/metareasoning_branch_bound.py \
            cwc/governance/sequential_risk_control.py \
            cwc/governance/statistical_authority.py
          git diff --check
      - name: Commit normalized code and self-delete privileged workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/ci-format-once.yml
          git add -u -- cwc/governance
          git diff --cached --check
          git commit -m "style: format legacy compound statements and remove maintenance workflow"
          git push origin HEAD:refs/heads/ci/verified-recovery-20261020
