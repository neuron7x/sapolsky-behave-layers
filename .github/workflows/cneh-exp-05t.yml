name: CNEH-EXP-05T sealed transition causality
on:
  pull_request:
    paths:
      - 'experiments/cneh_exp_05t/**'
      - '.github/workflows/cneh-exp-05t.yml'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen protocol and historical source
        run: |
          git merge-base --is-ancestor a0dad195ae0fb49742c7bb6e078f23b730dde033 HEAD
          git show a0dad195ae0fb49742c7bb6e078f23b730dde033:experiments/cneh_exp_05t/PROTOCOL.md | cmp - experiments/cneh_exp_05t/PROTOCOL.md
          git diff --exit-code 4e33f71cd0b863ec150991830fa2aad53ee84ccc HEAD -- experiments/cneh_exp_05n experiments/cneh_exp_05 experiments/cneh_exp_04g experiments/cneh_exp_05i scripts/cneh_promotion_gate.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retrieve all immutable parent artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir /tmp/archives
          for id in 14895699328 14896296016 14896011684 14896261054 14896181291; do
            curl --fail --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/neuron7x/sapolsky-behave-layers/actions/artifacts/$id/zip" --output "/tmp/archives/$id.zip"
          done
      - name: Independent semantics, external anchors and adversarial replay
        run: |
          mkdir /tmp/cneh05t-admission
          python -m experiments.cneh_exp_05t.admission --archives /tmp/archives --out /tmp/cneh05t-admission/report.json
          python -m experiments.cneh_exp_05t.admission --archives /tmp/archives --out /tmp/cneh05t-admission/report.json --verify
          python -m experiments.cneh_exp_05t.attacks --archives /tmp/archives --out /tmp/cneh05t-admission/attacks.json
          python -m experiments.cneh_exp_05t.attacks --archives /tmp/archives --out /tmp/cneh05t-admission/attacks.json --verify
          for f in report attacks; do
            python -m scripts.cneh_promotion_gate check-verdict --experiment CNEH-EXP-05T --verdict "/tmp/cneh05t-admission/$f.json"
          done
          (cd /tmp/cneh05t-admission && sha256sum attacks.json report.json > SHA256SUMS && sha256sum --strict -c SHA256SUMS)
      - name: Preserve independent admission
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh-exp-05t-admission
          path: /tmp/cneh05t-admission/
          if-no-files-found: error
          retention-days: 90
  workers:
    name: Local transition causality worker ${{ matrix.worker }}
    needs: admission
    strategy:
      fail-fast: false
      matrix:
        worker: [A, B]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BNSYN_USE_TORCH: '0'
      WORKER: ${{ matrix.worker }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate frozen protocol and native parent
        run: |
          git merge-base --is-ancestor a0dad195ae0fb49742c7bb6e078f23b730dde033 HEAD
          git show a0dad195ae0fb49742c7bb6e078f23b730dde033:experiments/cneh_exp_05t/PROTOCOL.md | cmp - experiments/cneh_exp_05t/PROTOCOL.md
          git diff --exit-code 4e33f71cd0b863ec150991830fa2aad53ee84ccc HEAD -- experiments/cneh_exp_05n experiments/cneh_exp_05 experiments/cneh_exp_04g experiments/cneh_exp_05i experiments/cneh_exp_01 scripts/cneh_promotion_gate.py
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: neuron7x/bnsyn-phase-controlled-emergent-dynamics
          ref: c1de425ce4ece362e7f2feb2d9f24da5d3231014
          path: .cneh-inputs/bnsyn
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Install native environment and retrieve sealed anchors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir /tmp/archives /tmp/cneh05t
          for id in 14895699328 14896011684; do
            curl --fail --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/neuron7x/sapolsky-behave-layers/actions/artifacts/$id/zip" --output "/tmp/archives/$id.zip"
          done
          python -m venv /tmp/cneh05t-env
          /tmp/cneh05t-env/bin/python -m pip install --require-hashes --only-binary=:all: -r experiments/cneh_exp_01/bnsyn-requirements.lock --report /tmp/cneh05t/install.json
      - name: Fixed baseline and default native one-step replays
        run: |
          PY=/tmp/cneh05t-env/bin/python
          DISABLE=$(env -u NPY_DISABLE_CPU_FEATURES "$PY" -c 'import numpy as np; from experiments.cneh_exp_05n.run import optional_features; print(",".join(optional_features(np)))')
          NPY_DISABLE_CPU_FEATURES="$DISABLE" "$PY" -m experiments.cneh_exp_05t.transition run --source .cneh-inputs/bnsyn --archives /tmp/archives --worker "$WORKER" --profile BASELINE --install-report /tmp/cneh05t/install.json --out /tmp/cneh05t/baseline.json
          env -u NPY_DISABLE_CPU_FEATURES "$PY" -m experiments.cneh_exp_05t.transition run --source .cneh-inputs/bnsyn --archives /tmp/archives --worker "$WORKER" --profile DEFAULT --install-report /tmp/cneh05t/install.json --baseline /tmp/cneh05t/baseline.json --out /tmp/cneh05t/default.json
      - name: Specific AVX512_ICL intervention, without assuming the answer
        run: |
          PY=/tmp/cneh05t-env/bin/python
          if env -u NPY_DISABLE_CPU_FEATURES "$PY" -c 'import numpy as np; from experiments.cneh_exp_05n.run import optional_features; raise SystemExit(0 if "AVX512_ICL" in optional_features(np) else 1)'; then
            NPY_DISABLE_CPU_FEATURES=AVX512_ICL "$PY" -m experiments.cneh_exp_05t.transition run --source .cneh-inputs/bnsyn --archives /tmp/archives --worker "$WORKER" --profile NO_ICL --install-report /tmp/cneh05t/install.json --out /tmp/cneh05t/no-icl.json
          else
            env -u NPY_DISABLE_CPU_FEATURES "$PY" -m experiments.cneh_exp_05t.transition run --source .cneh-inputs/bnsyn --archives /tmp/archives --worker "$WORKER" --profile NO_ICL --install-report /tmp/cneh05t/install.json --unavailable --out /tmp/cneh05t/no-icl.json
          fi
          (cd /tmp/cneh05t && sha256sum baseline.json default.json install.json no-icl.json > SHA256SUMS && sha256sum --strict -c SHA256SUMS)
      - name: Preserve raw prestate, poststate and operation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh-exp-05t-${{ matrix.worker }}
          path: /tmp/cneh05t/
          if-no-files-found: error
          retention-days: 90
  aggregate:
    needs: workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download same-run worker artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'cneh-exp-05t-[AB]' --dir /tmp/profiles
      - name: Compare actual one-step operation effects and replay verdict
        run: |
          mkdir /tmp/cneh05t-result
          python -m experiments.cneh_exp_05t.transition aggregate --profiles /tmp/profiles --out /tmp/cneh05t-result/report.json
          python -m experiments.cneh_exp_05t.transition aggregate --profiles /tmp/profiles --out /tmp/cneh05t-result/report.json --verify
          python -m scripts.cneh_promotion_gate check-verdict --experiment CNEH-EXP-05T --verdict /tmp/cneh05t-result/report.json
          (cd /tmp/cneh05t-result && sha256sum report.json > SHA256SUMS && sha256sum --strict -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh-exp-05t-aggregate
          path: /tmp/cneh05t-result/
          if-no-files-found: error
          retention-days: 90
