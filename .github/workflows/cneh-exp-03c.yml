name: CNEH-EXP-03C exact receiver isolation
on:
  pull_request:
    paths:
      - 'experiments/cneh_exp_03c/**'
      - 'tests/test_cneh_exp_03c.py'
      - '.github/workflows/cneh-exp-03c.yml'
      - 'experiments/cneh_exp_03/**'
      - 'experiments/cneh_exp_01/bnsyn*'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  exact-receiver-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BNSYN_USE_TORCH: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check frozen protocol and inherited gain source
        run: |
          git show c6454e2393b920556e213809f0d91831816edc1a:experiments/cneh_exp_03c/PREREGISTRATION.md | cmp - experiments/cneh_exp_03c/PREREGISTRATION.md
          git show 0429a8c3a11f2b34e51ea217c96648b7cf699457:experiments/cneh_exp_03/gain_intervention.py | cmp - experiments/cneh_exp_03/gain_intervention.py
          git show 0429a8c3a11f2b34e51ea217c96648b7cf699457:experiments/cneh_exp_03/gain_protocol.json | cmp - experiments/cneh_exp_03/gain_protocol.json
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: neuron7x/bnsyn-phase-controlled-emergent-dynamics
          ref: c1de425ce4ece362e7f2feb2d9f24da5d3231014
          path: .cneh-inputs/bnsyn
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing pinned runtime
        run: |
          python -m venv /tmp/cneh03c-env
          /tmp/cneh03c-env/bin/python -m pip install --require-hashes --only-binary=:all: -r experiments/cneh_exp_01/bnsyn-requirements.lock --report /tmp/cneh03c-install.json
      - name: Reject hidden ULP and spike differences
        run: /tmp/cneh03c-env/bin/python -m unittest discover -s tests -p test_cneh_exp_03c.py -v
      - name: Execute paired isolation and nonvacuity controls
        run: /tmp/cneh03c-env/bin/python -m experiments.cneh_exp_03c.run --source .cneh-inputs/bnsyn --out /tmp/cneh03c
      - name: Independently recompute all traces
        run: |
          /tmp/cneh03c-env/bin/python -m experiments.cneh_exp_03c.run --source .cneh-inputs/bnsyn --out /tmp/cneh03c --verify
          (cd /tmp/cneh03c && sha256sum --strict -c SHA256SUMS)
      - name: Preserve evidence including any counterexample
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh-exp-03c-exact-state-SHA256
          path: |
            /tmp/cneh03c/
            /tmp/cneh03c-install.json
          if-no-files-found: error
          retention-days: 90
