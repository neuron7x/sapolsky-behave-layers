name: CNEH-EXP-03 structural OOD mechanism pilot
on:
  pull_request:
    paths:
      - 'experiments/cneh_exp_03/**'
      - 'tests/test_cneh_exp_03*.py'
      - '.github/workflows/cneh-exp-03.yml'
      - 'experiments/cneh_exp_01/bnsyn_adapter.py'
      - 'experiments/cneh_exp_01/bnsyn_integration_contract.json'
      - 'experiments/cneh_exp_01/bnsyn-requirements.lock'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  structural-intervention:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BNSYN_USE_TORCH: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen pre-implementation protocol
        run: |
          git show 75bf7391d736b03e0a930ee7b61cb0ca46b469bf:experiments/cneh_exp_03/protocol.json | cmp - experiments/cneh_exp_03/protocol.json
          git show 6485be9e718c62ae869192d905e27200cee1fbe6:experiments/cneh_exp_03/PREREGISTRATION.md | cmp - experiments/cneh_exp_03/PREREGISTRATION.md
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: neuron7x/bnsyn-phase-controlled-emergent-dynamics
          ref: c1de425ce4ece362e7f2feb2d9f24da5d3231014
          path: .cneh-inputs/bnsyn
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing hash-locked neural runtime
        run: |
          python -m venv /tmp/cneh03-env
          /tmp/cneh03-env/bin/python -m pip install --require-hashes --only-binary=:all: -r experiments/cneh_exp_01/bnsyn-requirements.lock --report /tmp/cneh03-install.json
      - name: Structural mask, leakage and evidence falsifiers
        run: |
          /tmp/cneh03-env/bin/python -m unittest discover -s tests -p 'test_cneh_exp_03*.py' -v
      - name: Execute all eight frozen paired worlds
        run: |
          /tmp/cneh03-env/bin/python -m experiments.cneh_exp_03.run --source .cneh-inputs/bnsyn --out /tmp/cneh03-evidence
      - name: Full fresh replay and strict manifest
        run: |
          /tmp/cneh03-env/bin/python -m experiments.cneh_exp_03.run --source .cneh-inputs/bnsyn --out /tmp/cneh03-evidence --verify
          (cd /tmp/cneh03-evidence && sha256sum --strict -c SHA256SUMS)
      - name: Independent post-primary temporal reduction and mean-free probe reference
        run: |
          /tmp/cneh03-env/bin/python -m experiments.cneh_exp_03.post_primary_audit --source .cneh-inputs/bnsyn --primary /tmp/cneh03-evidence --out /tmp/cneh03-temporal
          (cd /tmp/cneh03-temporal && sha256sum --strict -c SHA256SUMS)
      - name: Archive separate post-primary diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh-exp-03-post-primary-temporal
          path: /tmp/cneh03-temporal/
          if-no-files-found: error
          retention-days: 90
      - name: Archive all outcomes including nulls
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh-exp-03-structural-paired-worlds
          path: |
            /tmp/cneh03-evidence/
            /tmp/cneh03-install.json
          if-no-files-found: error
          retention-days: 90

  gain-path-intervention:
    name: EXP03B gain-clamp and synaptic delivery falsification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BNSYN_USE_TORCH: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify separately frozen prospective EXP03B protocol
        run: |
          git show 739506c8265ac81678a8061343eb2ddcefec1120:experiments/cneh_exp_03/gain_protocol.json | cmp - experiments/cneh_exp_03/gain_protocol.json
          git show 090985ca9439d85d1c26f69176e4b2c8bc07b58d:experiments/cneh_exp_03/gain_preregistration.md | cmp - experiments/cneh_exp_03/gain_preregistration.md
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: neuron7x/bnsyn-phase-controlled-emergent-dynamics
          ref: c1de425ce4ece362e7f2feb2d9f24da5d3231014
          path: .cneh-inputs/bnsyn
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned numerical runtime
        run: |
          python -m venv /tmp/cneh03b-env
          /tmp/cneh03b-env/bin/python -m pip install --require-hashes --only-binary=:all: -r experiments/cneh_exp_01/bnsyn-requirements.lock --report /tmp/cneh03b-install.json
      - name: Calibrate gain delivery and conductance falsifiers
        run: |
          /tmp/cneh03b-env/bin/python -m unittest discover -s tests -p 'test_cneh_exp_03_gain_intervention.py' -v
      - name: Execute 64 frozen factorial episodes
        run: |
          /tmp/cneh03b-env/bin/python -m experiments.cneh_exp_03.gain_intervention --source .cneh-inputs/bnsyn --out /tmp/cneh03b
      - name: Recompute all traces and verify manifest
        run: |
          /tmp/cneh03b-env/bin/python -m experiments.cneh_exp_03.gain_intervention --source .cneh-inputs/bnsyn --out /tmp/cneh03b --verify
          (cd /tmp/cneh03b && sha256sum --strict -c SHA256SUMS)
      - name: Archive separate EXP03B evidence and dependency receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh-exp-03b-gain-path-SHA256
          path: |
            /tmp/cneh03b/
            /tmp/cneh03b-install.json
          if-no-files-found: error
          retention-days: 90
