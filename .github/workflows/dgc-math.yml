name: dgc-math

permissions:
  contents: read

on:
  push:
    paths:
      - "cwc/governance/**"
      - "tests/test_dgc_math*.py"
      - "tests/test_dgc_mathematics*.py"
      - "scripts/dgc_math*.py"
      - "scripts/dgc_exact_meta_modelcheck.py"
      - "scripts/dgc_robust_bound_exact_modelcheck.py"
      - "scripts/dgc_triage_family_theorem.py"
      - "scripts/dgc_proof_ledger_gate.py"
      - "scripts/dgc_verification_gate.py"
      - "research/registry/dgc_math_proof_ledger_v1.json"
      - "docs/DGC_MATHEMAT*.md"
      - "docs/references/DGC_*MATH*.md"
      - ".github/workflows/dgc-math.yml"
  pull_request:
    paths:
      - "cwc/governance/**"
      - "tests/test_dgc_math*.py"
      - "tests/test_dgc_mathematics*.py"
      - "scripts/dgc_math*.py"
      - "scripts/dgc_exact_meta_modelcheck.py"
      - "scripts/dgc_robust_bound_exact_modelcheck.py"
      - "scripts/dgc_triage_family_theorem.py"
      - "scripts/dgc_proof_ledger_gate.py"
      - "scripts/dgc_verification_gate.py"
      - "research/registry/dgc_math_proof_ledger_v1.json"
      - "docs/DGC_MATHEMAT*.md"
      - "docs/references/DGC_*MATH*.md"
      - ".github/workflows/dgc-math.yml"

concurrency:
  group: dgc-math-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  math:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: cwc-requirements-dev.txt
      - name: Install pure-logic test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r cwc-requirements-dev.txt
      - name: DGC mathematics regression v2-v2j
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_dgc_mathematics_v2.py \
            tests/test_dgc_mathematics_v2b.py \
            tests/test_dgc_math_v2c.py \
            tests/test_dgc_math_v2d.py \
            tests/test_dgc_math_v2e.py \
            tests/test_dgc_math_v2f.py \
            tests/test_dgc_math_v2g.py \
            tests/test_dgc_math_v2h.py \
            tests/test_dgc_math_v2i.py \
            tests/test_dgc_math_v2j.py
      - name: DGC mathematical falsification gates
        run: |
          PYTHONPATH=. python scripts/dgc_math_gate.py
          PYTHONPATH=. python scripts/dgc_math_gate_v2b.py
          PYTHONPATH=. python scripts/dgc_math_v2c_attack.py
          PYTHONPATH=. python scripts/dgc_math_v2d_attack.py
          PYTHONPATH=. python scripts/dgc_math_v2e_attack.py
          PYTHONPATH=. python scripts/dgc_math_v2f_attack.py
          PYTHONPATH=. python scripts/dgc_math_v2g_attack.py
          PYTHONPATH=. python scripts/dgc_math_v2h_attack.py
          PYTHONPATH=. python scripts/dgc_math_v2i_attack.py
          PYTHONPATH=. python scripts/dgc_math_v2j_attack.py
      - name: Exact mathematical model checks
        run: |
          PYTHONPATH=. python scripts/dgc_exact_meta_modelcheck.py
          PYTHONPATH=. python scripts/dgc_robust_bound_exact_modelcheck.py
          PYTHONPATH=. python scripts/dgc_triage_family_theorem.py
          PYTHONPATH=. python scripts/dgc_proof_ledger_gate.py
      - name: Canonical DGC governance fault gate
        run: PYTHONPATH=. python scripts/dgc_verification_gate.py
