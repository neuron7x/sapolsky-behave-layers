jobs:
  product-evidence-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Install pure-Python test tooling
        run: python -m pip install pytest tomli==2.2.1
      - name: Product evidence contract tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_dgc_product_economics.py \
            tests/test_dgc_product_statistical_plan.py \
            tests/test_dgc_evaluation_harness.py \
            tests/test_dgc_product_evidence.py \
            tests/test_dgc_evidence_bundle.py \
            tests/test_dgc_workload_seal.py \
            tests/test_dgc_baseline_panel.py \
            tests/test_dgc_learned_baseline.py \
            tests/test_dgc_b2_fit_receipt.py \
            tests/test_dgc_calibration_variance.py \
            tests/test_dgc_trial_sizing_receipt.py \
            tests/test_dgc_deployment_qualification.py \
            tests/test_dgc_independent_replication.py \
            tests/test_dgc_physical_cost_evidence.py \
            tests/test_dgc_product_counterfactual_frontier.py \
            tests/test_dgc_product_external_source_authority.py \
            tests/test_dgc_product_external_materialization.py \
            tests/test_dgc_distributed_eval_control.py \
            tests/test_dgc_confirmatory_generation.py \
            tests/test_dgc_continuous_assurance.py \
            tests/test_dgc_combinatorial_coverage.py \
            tests/test_dgc_release_builder.py
      - name: Learned B2 baseline falsification gate
        run: PYTHONPATH=. python scripts/dgc_learned_baseline_attack.py
      - name: B2 fit receipt falsification gate
        run: PYTHONPATH=. python scripts/dgc_b2_fit_receipt_attack.py
      - name: Calibration variance falsification gate
        run: PYTHONPATH=. python scripts/dgc_calibration_variance_attack.py
      - name: Cluster-aware trial sizing receipt falsification gate
        run: PYTHONPATH=. python scripts/dgc_trial_sizing_receipt_attack.py
      - name: Distributed evaluation falsification gate
        run: PYTHONPATH=. python scripts/dgc_distributed_eval_attack.py
      - name: Distributed evaluation finite timing modelcheck
        run: PYTHONPATH=. python scripts/dgc_distributed_eval_modelcheck.py
      - name: Confirmatory generation cross-layer falsification gate
        run: PYTHONPATH=. python scripts/dgc_confirmatory_generation_attack.py
      - name: Continuous assurance falsification gate
        run: PYTHONPATH=. python scripts/dgc_continuous_assurance_attack.py
      - name: Combinatorial coverage falsification gate
        run: PYTHONPATH=. python scripts/dgc_combinatorial_coverage_attack.py
      - name: External source authority gate
        run: PYTHONPATH=. python scripts/dgc_product_external_source_gate.py
      - name: Counterfactual compute allocation falsification gate
        run: PYTHONPATH=. python scripts/dgc_product_counterfactual_oracle_gate.py
      - name: Validate current-truth promotion semantics
        run: PYTHONPATH=. python scripts/dgc_product_promotion_gate.py
      - name: Deterministic release double-build gate
        run: PYTHONPATH=. python scripts/dgc_release_repro_gate.py

  product-qualified-release:
    if: startsWith(github.ref, 'refs/tags/dgc-product-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Require PRODUCT_QUALIFIED evidence state
        run: PYTHONPATH=. python scripts/dgc_product_promotion_gate.py --require-stage PRODUCT_QUALIFIED
      - name: Require complete SHA-sealed evidence bundle
        run: PYTHONPATH=. python scripts/dgc_product_bundle_gate.py
      - name: Require deterministic double-build release
        run: PYTHONPATH=. python scripts/dgc_release_repro_gate.py
      - name: Build exact product-qualified DGC release
        run: PYTHONPATH=. python scripts/make_dgc_release.py --out dist/dgc-release --require-product-qualified
