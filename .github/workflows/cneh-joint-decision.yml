name: CNEH-COVER-02 joint support and regret
on:
  pull_request:
    paths:
      - 'experiments/cneh_joint_decision/**'
      - 'tests/test_cneh_correlated_decision.py'
      - '.github/workflows/cneh-joint-decision.yml'
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact parent tree and frozen protocol
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = "$ARCH"
          git merge-base --is-ancestor "$HEAD_SHA" HEAD
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git merge-base --is-ancestor 5d75a637685a3036ca9f764a29fd5dff78f0fdc1 "$BASE_SHA"
          git diff --exit-code 5d75a637685a3036ca9f764a29fd5dff78f0fdc1 "$BASE_SHA" --
          git merge-base --is-ancestor f5e50a54104bf88da1510eeec6e5c33b2e9552f6 HEAD
          git show f5e50a54104bf88da1510eeec6e5c33b2e9552f6:experiments/cneh_cover_assurance/CORRELATED_DECISION_PROTOCOL.md | cmp - experiments/cneh_joint_decision/PROTOCOL.md
          git diff --name-status "$BASE_SHA" HEAD | sort > /tmp/actual
          printf 'A\t%s\n' '.github/workflows/cneh-joint-decision.yml' 'experiments/cneh_joint_decision/PROTOCOL.md' 'experiments/cneh_joint_decision/REPRODUCE.md' 'experiments/cneh_joint_decision/decision.py' 'experiments/cneh_joint_decision/panel.py' 'experiments/cneh_joint_decision/run.py' 'tests/test_cneh_correlated_decision.py' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Authenticate sealed COVER-01 aggregate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/neuron7x/sapolsky-behave-layers/actions/artifacts/15000064783/zip" --output /tmp/parent.zip
          echo 'a2fd1fc8e32568c7549919dd70bf507a8870823cc000b01cc7083eb7043b27e9  /tmp/parent.zip' | sha256sum --strict -c -
      - name: Independent vertex and decision proof controls
        run: timeout --kill-after=5s 120s python -B -m unittest discover -s tests -p test_cneh_correlated_decision.py -v
      - name: Frozen evaluation and separate optimized replay
        id: panel
        run: |
          PRIMARY_RC=0
          REPLAY_RC=0
          PYTHONHASHSEED=0 time -p timeout --kill-after=5s 480s python -B -m experiments.cneh_joint_decision.run native --arch "$ARCH" --head "$HEAD_SHA" --base "$BASE_SHA" --checkout "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --parent /tmp/parent.zip --out /tmp/panel/primary || PRIMARY_RC=$?
          PYTHONHASHSEED=2147483647 time -p timeout --kill-after=5s 480s python -B -O -m experiments.cneh_joint_decision.run native --arch "$ARCH" --head "$HEAD_SHA" --base "$BASE_SHA" --checkout "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --parent /tmp/parent.zip --out /tmp/panel/replay || REPLAY_RC=$?
          printf 'primary_exit=%s replay_exit=%s\n' "$PRIMARY_RC" "$REPLAY_RC"
          test "$PRIMARY_RC" -eq 0
          test "$REPLAY_RC" -eq 0
          cmp /tmp/panel/primary/payload.json /tmp/panel/replay/payload.json
          cmp /tmp/panel/primary/receipt.json /tmp/panel/replay/receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && steps.panel.outcome != 'skipped' }}
        with:
          name: cnehcover02-${{ matrix.arch }}-attempt-${{ github.run_attempt }}
          path: /tmp/panel/
          if-no-files-found: error
          retention-days: 90
  aggregate:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Retrieve exact-attempt receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 5d75a637685a3036ca9f764a29fd5dff78f0fdc1 "$BASE_SHA"
          git diff --exit-code 5d75a637685a3036ca9f764a29fd5dff78f0fdc1 "$BASE_SHA" --
          curl --fail --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/neuron7x/sapolsky-behave-layers/actions/artifacts/15000064783/zip" --output /tmp/parent.zip
          for arch in aarch64 x86_64; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "cnehcover02-$arch-attempt-$GITHUB_RUN_ATTEMPT" --dir "/tmp/profiles/cnehcover02-$arch"
          done
      - name: Independently reconstruct and preserve negative authority
        id: reconstruction
        run: |
          time -p timeout --kill-after=5s 480s python -B -m experiments.cneh_joint_decision.run aggregate --parent /tmp/parent.zip --profiles /tmp/profiles --head "$HEAD_SHA" --base "$BASE_SHA" --checkout "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --out /tmp/aggregate
          python -B -m scripts.cneh_promotion_gate check-verdict --experiment CNEH-COVER-02 --verdict /tmp/aggregate/report.json
          (cd /tmp/aggregate && sha256sum --strict -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && steps.reconstruction.outcome != 'skipped' }}
        with:
          name: cnehcover02-aggregate-attempt-${{ github.run_attempt }}
          path: /tmp/aggregate
          if-no-files-found: error
          retention-days: 90
