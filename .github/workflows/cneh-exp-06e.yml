name: CNEH-EXP-06E structural quotient falsification
on:
  pull_request:
    paths:
      - 'experiments/cneh_exp_06e/**'
      - 'tests/test_cneh_exp_06e.py'
      - '.github/workflows/cneh-exp-06e.yml'
  workflow_dispatch: {}
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  native:
    if: github.event_name == 'pull_request'
    name: Native ${{ matrix.arch }} exact quotient
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen protocol and parent source preservation
        run: |
          git merge-base --is-ancestor 5addb8a825e08cd72d8f8e0cc37b808f0f9e898b HEAD
          git show 5addb8a825e08cd72d8f8e0cc37b808f0f9e898b:experiments/cneh_exp_06e/PROTOCOL.md | cmp - experiments/cneh_exp_06e/PROTOCOL.md
          git merge-base --is-ancestor 22d786bf843a10a398e96db75fcd4be72a7ed1a0 HEAD
          git diff --name-only 22d786bf843a10a398e96db75fcd4be72a7ed1a0 HEAD | sort > /tmp/actual
          printf '%s\n' '.github/workflows/cneh-exp-06e.yml' 'experiments/cneh_exp_06e/PROTOCOL.md' 'experiments/cneh_exp_06e/assurance.py' 'experiments/cneh_exp_06e/quotient.py' 'experiments/cneh_exp_06e/run.py' 'tests/test_cneh_exp_06e.py' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          test "$(uname -m)" = "$ARCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Authenticate sealed D evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/neuron7x/sapolsky-behave-layers/actions/artifacts/14934927808/zip" --output /tmp/parent.zip
          echo '2cc2ed3254a9467a32830976e0e0f6373f9e6d8e9904073d60dbb2c12bd02f49  /tmp/parent.zip' | sha256sum --strict -c -
      - name: Execute independent assertions
        run: python -m unittest discover -s tests -p test_cneh_exp_06e.py -v
      - name: Bounded feedback-directed assurance with independent process replay
        id: assurance
        run: |
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          test "$CHECKOUT_SHA" = "$GITHUB_SHA"
          PRIMARY_RC=0
          REPLAY_RC=0
          PYTHONHASHSEED=0 timeout --kill-after=5s 180s python -m experiments.cneh_exp_06e.assurance --head "$HEAD_SHA" --checkout "$CHECKOUT_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --out /tmp/assurance/primary || PRIMARY_RC=$?
          PYTHONHASHSEED=2147483647 timeout --kill-after=5s 180s python -O -m experiments.cneh_exp_06e.assurance --head "$HEAD_SHA" --checkout "$CHECKOUT_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --out /tmp/assurance/replay || REPLAY_RC=$?
          printf 'primary_exit=%s replay_exit=%s\n' "$PRIMARY_RC" "$REPLAY_RC"
          test "$PRIMARY_RC" -eq 0
          test "$REPLAY_RC" -eq 0
          cmp /tmp/assurance/primary/report.json /tmp/assurance/replay/report.json
          cmp /tmp/assurance/primary/SHA256SUMS /tmp/assurance/replay/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && steps.assurance.outcome != 'skipped' }}
        with:
          name: assurance-cneh06e-${{ matrix.arch }}-attempt-${{ github.run_attempt }}
          path: /tmp/assurance/
          if-no-files-found: error
          retention-days: 90
      - name: Execute complete fixed panel
        env:
          PYTHONHASHSEED: '0'
        run: python -m experiments.cneh_exp_06e.run native --arch "$ARCH" --head "$HEAD_SHA" --run-id "$GITHUB_RUN_ID" --parent /tmp/parent.zip --out /tmp/result
      - name: Autonomous three-process replay and optimization invariance
        run: |
          PYTHONHASHSEED=1 python -m experiments.cneh_exp_06e.run native --arch "$ARCH" --head "$HEAD_SHA" --run-id "$GITHUB_RUN_ID" --parent /tmp/parent.zip --out /tmp/replay-1
          PYTHONHASHSEED=2147483647 python -O -m experiments.cneh_exp_06e.run native --arch "$ARCH" --head "$HEAD_SHA" --run-id "$GITHUB_RUN_ID" --parent /tmp/parent.zip --out /tmp/replay-2
          for replica in /tmp/replay-1 /tmp/replay-2; do
            cmp /tmp/result/payload.json "$replica/payload.json"
            cmp /tmp/result/receipt.json "$replica/receipt.json"
          done
          sha256sum /tmp/result/payload.json /tmp/replay-1/payload.json /tmp/replay-2/payload.json
          echo "REPLAY_PASS: three independent processes, three hash seeds, one optimized interpreter; native $ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh06e-${{ matrix.arch }}-attempt-${{ github.run_attempt }}
          path: /tmp/result/
          if-no-files-found: error
          retention-days: 90
  aggregate:
    if: github.event_name == 'pull_request'
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Retrieve both native receipts and sealed parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/neuron7x/sapolsky-behave-layers/actions/artifacts/14934927808/zip" --output /tmp/parent.zip
          # Exact same-attempt artifacts only; partial reruns fail closed.
          # Rerun all jobs to create a complete new evidence set.
          for arch in aarch64 x86_64; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "cneh06e-$arch-attempt-$GITHUB_RUN_ATTEMPT" --dir "/tmp/profiles/cneh06e-$arch"
          done
      - name: Independently reconstruct all adaptive assurance receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for arch in aarch64 x86_64; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "assurance-cneh06e-$arch-attempt-$GITHUB_RUN_ATTEMPT" --dir "/tmp/assurance-profiles/assurance-cneh06e-$arch"
          done
          timeout --kill-after=5s 180s python -m experiments.cneh_exp_06e.assurance --profiles /tmp/assurance-profiles --head "$HEAD_SHA" --checkout "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Reconstruct complete raw panel and enforce negative admission
        run: |
          python -m experiments.cneh_exp_06e.run aggregate --parent /tmp/parent.zip --profiles /tmp/profiles --head "$HEAD_SHA" --run-id "$GITHUB_RUN_ID" --out /tmp/aggregate
          python -m scripts.cneh_promotion_gate check-verdict --experiment CNEH-EXP-06E --verdict /tmp/aggregate/report.json
          (cd /tmp/aggregate && sha256sum --strict -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh06e-aggregate-attempt-${{ github.run_attempt }}
          path: /tmp/aggregate/
          if-no-files-found: error
          retention-days: 90

  # Periodic and manual regression is intentionally separate from exact-head scientific
  # evidence admission. It neither reuses expiring parent receipts nor grants
  # calibration, control authority or scientific promotion.
  scheduled-regression:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Scheduled regression ${{ matrix.arch }} (engineering only)
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen protocol and native architecture
        run: |
          git merge-base --is-ancestor 5addb8a825e08cd72d8f8e0cc37b808f0f9e898b HEAD
          git show 5addb8a825e08cd72d8f8e0cc37b808f0f9e898b:experiments/cneh_exp_06e/PROTOCOL.md | cmp - experiments/cneh_exp_06e/PROTOCOL.md
          test "$(uname -m)" = "$ARCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Execute all quotient assurance tests
        run: python -m unittest discover -s tests -p test_cneh_exp_06e.py -v
      - name: Bounded feedback-directed assurance with independent process replay
        id: assurance
        run: |
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          test "$CHECKOUT_SHA" = "$GITHUB_SHA"
          PRIMARY_RC=0
          REPLAY_RC=0
          PYTHONHASHSEED=0 timeout --kill-after=5s 180s python -m experiments.cneh_exp_06e.assurance --head "$HEAD_SHA" --checkout "$CHECKOUT_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --out /tmp/assurance/primary || PRIMARY_RC=$?
          PYTHONHASHSEED=2147483647 timeout --kill-after=5s 180s python -O -m experiments.cneh_exp_06e.assurance --head "$HEAD_SHA" --checkout "$CHECKOUT_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --out /tmp/assurance/replay || REPLAY_RC=$?
          printf 'primary_exit=%s replay_exit=%s\n' "$PRIMARY_RC" "$REPLAY_RC"
          test "$PRIMARY_RC" -eq 0
          test "$REPLAY_RC" -eq 0
          cmp /tmp/assurance/primary/report.json /tmp/assurance/replay/report.json
          cmp /tmp/assurance/primary/SHA256SUMS /tmp/assurance/replay/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && steps.assurance.outcome != 'skipped' }}
        with:
          name: assurance-cneh06e-${{ matrix.arch }}-attempt-${{ github.run_attempt }}
          path: /tmp/assurance/
          if-no-files-found: error
          retention-days: 90
      - name: Regenerate and compare raw synthetic reports
        run: |
          mkdir /tmp/weekly
          PYTHONHASHSEED=0 python -c 'import sys; from experiments.cneh_exp_06e import quotient as q, run; sys.stdout.buffer.write(run.canonical(q.report()))' > /tmp/weekly/payload.json
          PYTHONHASHSEED=1 python -c 'import sys; from experiments.cneh_exp_06e import quotient as q, run; sys.stdout.buffer.write(run.canonical(q.report()))' > /tmp/weekly-replay-1.json
          PYTHONHASHSEED=2147483647 python -O -c 'import sys; from experiments.cneh_exp_06e import quotient as q, run; sys.stdout.buffer.write(run.canonical(q.report()))' > /tmp/weekly-replay-2.json
          cmp /tmp/weekly/payload.json /tmp/weekly-replay-1.json
          cmp /tmp/weekly/payload.json /tmp/weekly-replay-2.json
          (cd /tmp/weekly && sha256sum payload.json > SHA256SUMS)
          printf '%s\n' 'REGRESSION_ONLY_NOT_SCIENTIFIC_ADMISSION' > /tmp/weekly/SCOPE
          git rev-parse HEAD > /tmp/weekly/HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh06e-weekly-${{ matrix.arch }}-attempt-${{ github.run_attempt }}
          path: /tmp/weekly/
          if-no-files-found: error
          retention-days: 30
  scheduled-compare:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: scheduled-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Independently reconstruct all adaptive assurance receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for arch in aarch64 x86_64; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "assurance-cneh06e-$arch-attempt-$GITHUB_RUN_ATTEMPT" --dir "/tmp/assurance-profiles/assurance-cneh06e-$arch"
          done
          timeout --kill-after=5s 180s python -m experiments.cneh_exp_06e.assurance --profiles /tmp/assurance-profiles --head "$HEAD_SHA" --checkout "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Compare independently regenerated native reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for arch in aarch64 x86_64; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "cneh06e-weekly-$arch-attempt-$GITHUB_RUN_ATTEMPT" --dir "/tmp/weekly-native/cneh06e-weekly-$arch"
          done
          timeout --kill-after=5s 180s python -m experiments.cneh_exp_06e.assurance --regression-profiles /tmp/weekly-native --head "$HEAD_SHA" --checkout "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
