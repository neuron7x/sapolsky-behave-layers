name: CNEH-EXP-05D certified exponential full-state qualification
on:
  pull_request:
    paths:
      - 'experiments/cneh_exp_05d/**'
      - 'tests/test_cneh_exp_05d_certified.py'
      - '.github/workflows/cneh-exp-05d.yml'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  workers:
    name: Certified numerical worker ${{ matrix.worker }}
    strategy:
      fail-fast: false
      matrix:
        worker: [A, B]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BNSYN_USE_TORCH: '0'
      WORKER: ${{ matrix.worker }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate frozen protocol and historical source
        run: |
          git merge-base --is-ancestor d1991e407ca81256a53e063abb04e31910bb0ef2 HEAD
          git show d1991e407ca81256a53e063abb04e31910bb0ef2:experiments/cneh_exp_05d/PROTOCOL.md | cmp - experiments/cneh_exp_05d/PROTOCOL.md
          git diff --exit-code 68a4d9a9287401fdaa934732e490e9c4295edf75 HEAD -- experiments/cneh_exp_05n experiments/cneh_exp_05t experiments/cneh_exp_05 experiments/cneh_exp_04g experiments/cneh_exp_05i experiments/cneh_exp_01 scripts/cneh_promotion_gate.py
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: neuron7x/bnsyn-phase-controlled-emergent-dynamics
          ref: c1de425ce4ece362e7f2feb2d9f24da5d3231014
          path: .cneh-inputs/bnsyn
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Install locked environment and authenticate witnesses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/neuron7x/sapolsky-behave-layers/actions/artifacts/14896203693/zip" --output /tmp/cneh05t-witness.zip
          echo 'faea2bd5bd390a630464727b150111cc0726fcfd4c2373c4eaf9d6c80358b23e  /tmp/cneh05t-witness.zip' | sha256sum --strict -c -
          python -m venv /tmp/cneh05d-env
          /tmp/cneh05d-env/bin/python -m pip install --require-hashes --only-binary=:all: -r experiments/cneh_exp_01/bnsyn-requirements.lock --report /tmp/cneh05d-install.json
          /tmp/cneh05d-env/bin/python -m unittest discover -s tests -p test_cneh_exp_05d_certified.py -v
      - name: Corrected DEFAULT dispatch two fresh processes
        run: |
          PY=/tmp/cneh05d-env/bin/python
          mkdir /tmp/cneh05d-default
          cp /tmp/cneh05d-install.json /tmp/cneh05d-default/install.json
          for attempt in 1 2; do
            env -u NPY_DISABLE_CPU_FEATURES "$PY" -m experiments.cneh_exp_05d.run run --source .cneh-inputs/bnsyn --witness /tmp/cneh05t-witness.zip --worker "$WORKER" --profile DEFAULT --attempt "$attempt" --install-report /tmp/cneh05d-default/install.json --out "/tmp/cneh05d-default/panel-$attempt.json.gz" --receipt "/tmp/cneh05d-default/receipt-$attempt.json"
          done
          (cd /tmp/cneh05d-default && sha256sum install.json panel-1.json.gz panel-2.json.gz receipt-1.json receipt-2.json > SHA256SUMS && sha256sum --strict -c SHA256SUMS)
      - name: Corrected BASELINE dispatch two fresh processes
        if: always()
        run: |
          PY=/tmp/cneh05d-env/bin/python
          mkdir /tmp/cneh05d-baseline
          cp /tmp/cneh05d-install.json /tmp/cneh05d-baseline/install.json
          DISABLE=$(env -u NPY_DISABLE_CPU_FEATURES "$PY" -c 'import numpy as np; from experiments.cneh_exp_05n.run import optional_features; print(",".join(optional_features(np)))')
          for attempt in 1 2; do
            NPY_DISABLE_CPU_FEATURES="$DISABLE" "$PY" -m experiments.cneh_exp_05d.run run --source .cneh-inputs/bnsyn --witness /tmp/cneh05t-witness.zip --worker "$WORKER" --profile BASELINE --attempt "$attempt" --install-report /tmp/cneh05d-baseline/install.json --out "/tmp/cneh05d-baseline/panel-$attempt.json.gz" --receipt "/tmp/cneh05d-baseline/receipt-$attempt.json"
          done
          (cd /tmp/cneh05d-baseline && sha256sum install.json panel-1.json.gz panel-2.json.gz receipt-1.json receipt-2.json > SHA256SUMS && sha256sum --strict -c SHA256SUMS)
      - name: Preserve DEFAULT full raw states
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh-exp-05d-${{ matrix.worker }}-DEFAULT
          path: /tmp/cneh05d-default/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve BASELINE full raw states
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh-exp-05d-${{ matrix.worker }}-BASELINE
          path: /tmp/cneh05d-baseline/
          if-no-files-found: error
          retention-days: 90
  aggregate:
    needs: workers
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Retrieve exact same-run profile roster
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'cneh-exp-05d-*-*' --dir /tmp/profiles
      - name: Independent full-state semantics and exact cross-domain comparison
        run: |
          mkdir /tmp/cneh05d-result
          set +e
          python -m experiments.cneh_exp_05d.run aggregate --profiles /tmp/profiles --out /tmp/cneh05d-result/report.json
          first=$?
          python -m experiments.cneh_exp_05d.run aggregate --profiles /tmp/profiles --out /tmp/cneh05d-result/report.json --verify
          second=$?
          set -e
          test "$first" = "$second"
          python -m scripts.cneh_promotion_gate check-verdict --experiment CNEH-EXP-05D --verdict /tmp/cneh05d-result/report.json
          (cd /tmp/cneh05d-result && sha256sum report.json > SHA256SUMS && sha256sum --strict -c SHA256SUMS)
          exit "$first"
      - name: Preserve corrected finite panel verdict
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh-exp-05d-aggregate
          path: /tmp/cneh05d-result/
          if-no-files-found: error
          retention-days: 90
