name: REAL-TRANSFER-01 pinned source intake
on:
  pull_request:
    paths:
      - 'experiments/real_transfer_01/**'
      - 'tests/test_real_transfer_source_intake.py'
      - '.github/workflows/real-transfer-source-intake.yml'
permissions:
  contents: read
jobs:
  source-intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve frozen experiment and intake contract
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor bdc3d736692aeb1362c12918afc022fa11c7ca2c HEAD
          git diff --exit-code bdc3d736692aeb1362c12918afc022fa11c7ca2c HEAD -- experiments/real_transfer_01/PREREGISTRATION.md experiments/real_transfer_01/PRE_EXECUTION_AMENDMENT_001.md experiments/real_transfer_01/PRE_EXECUTION_AMENDMENT_002.md experiments/real_transfer_01/contract.py experiments/real_transfer_01/evaluator.py experiments/real_transfer_01/preflight.py experiments/real_transfer_01/readiness.py experiments/real_transfer_01/semantic_gate.py experiments/real_transfer_01/temporal_gate.py claim_registry.json
          git merge-base --is-ancestor 2b11ad0a502f2228b15a8728f9de18d74a0f5009 HEAD
          git show 2b11ad0a502f2228b15a8728f9de18d74a0f5009:experiments/real_transfer_01/INTAKE_CONTRACT.md | cmp - experiments/real_transfer_01/INTAKE_CONTRACT.md
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Frozen source and semantic controls
        run: |
          python -B -m unittest discover -s tests -p test_real_transfer_source_intake.py -v
          python -B -m experiments.real_transfer_01.temporal_gate --json
          python -B -m experiments.real_transfer_01.semantic_gate
      - name: Download pinned public sources, no raw artifact publication
        id: download
        run: |
          mkdir -p /tmp/cwc-source-cache /tmp/cwc-source-receipt
          fetch() {
            if ! curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-filesize "$2" --max-time 240 --output "/tmp/cwc-source-cache/$3" "$1"; then
              rm -f "/tmp/cwc-source-cache/$3"
            fi
          }
          fetch 'https://raw.githubusercontent.com/MichSchli/AVeriTeC/7c62d1ec8df3fb560d6efe2b85fa191135636f81/data/dev.json' 4194304 averitec_dev.json
          fetch 'https://raw.githubusercontent.com/wenhuchen/HybridQA/db22fda8c5951438fade3c69d75b350335ba93b3/released_data/dev.json' 4194304 hybridqa_dev.json
          fetch 'https://github.com/wenhuchen/WikiTables-WithLinks/archive/f4ed68e54e25c495f63d309de0b89c0f97b3c508.zip' 268435456 wikitable_links.zip
      - name: Reconstruct source receipts without running a model
        id: intake
        run: |
          rc=0
          timeout --kill-after=10s 300s python -B -m experiments.real_transfer_01.source_intake --cache /tmp/cwc-source-cache --receipt /tmp/cwc-source-receipt/source-intake.json || rc=$?
          if test -f /tmp/cwc-source-receipt/source-intake.json; then
            (cd /tmp/cwc-source-receipt && sha256sum source-intake.json > SHA256SUMS)
          fi
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && steps.intake.outcome != 'skipped' }}
        with:
          name: real-transfer-source-receipt-attempt-${{ github.run_attempt }}
          path: /tmp/cwc-source-receipt/
          if-no-files-found: error
          retention-days: 90
