name: CNEH-EXP-06H reference-assisted gauge falsification
on:
  pull_request:
    paths:
      - 'experiments/cneh_exp_06h/**'
      - 'tests/test_cneh_exp_06h.py'
      - '.github/workflows/cneh-exp-06h.yml'
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
jobs:
  native:
    name: Native ${{ matrix.arch }} reference-assisted gauge falsification
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact base, frozen protocol and source preservation
        run: |
          test "$BASE_SHA" = "0f3ae2ee00001b9d99adcedb95443ce6ae3f4bfc"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$HEAD_SHA" HEAD
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git merge-base --is-ancestor 316ad0430aca637037f817f8f125ac4e4e9aa34a "$BASE_SHA"
          git diff --exit-code 316ad0430aca637037f817f8f125ac4e4e9aa34a "$BASE_SHA" --
          git merge-base --is-ancestor e573be70a0c7af1deafe28b2c6692478b487727c HEAD
          git show e573be70a0c7af1deafe28b2c6692478b487727c:experiments/cneh_exp_06h/PROTOCOL.md | cmp - experiments/cneh_exp_06h/PROTOCOL.md
          git diff --name-only "$BASE_SHA" HEAD | sort > /tmp/actual
          printf '%s\n' '.github/workflows/cneh-exp-06h.yml' 'experiments/cneh_exp_06h/PROTOCOL.md' 'experiments/cneh_exp_06h/panel.py' 'experiments/cneh_exp_06h/reference.py' 'experiments/cneh_exp_06h/run.py' 'tests/test_cneh_exp_06h.py' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          test "$(uname -m)" = "$ARCH"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Authenticate sealed parent G evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/neuron7x/sapolsky-behave-layers/actions/artifacts/14945669685/zip" --output /tmp/parent.zip
          echo '5ff7e7857e3420d4ca0909515ac58a3eb11bac335dcc2c1081d094e8db1b50f8  /tmp/parent.zip' | sha256sum --strict -c -
      - name: Independent contracts and mutation probes
        run: python -m unittest discover -s tests -p test_cneh_exp_06h.py -v
      - name: Complete fixed panel and independent optimized replay
        id: panel
        run: |
          PRIMARY_RC=0
          REPLAY_RC=0
          PYTHONHASHSEED=0 timeout --kill-after=5s 240s python -m experiments.cneh_exp_06h.run native --arch "$ARCH" --head "$HEAD_SHA" --base "$BASE_SHA" --checkout "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --parent /tmp/parent.zip --out /tmp/panel/primary || PRIMARY_RC=$?
          PYTHONHASHSEED=2147483647 timeout --kill-after=5s 240s python -O -m experiments.cneh_exp_06h.run native --arch "$ARCH" --head "$HEAD_SHA" --base "$BASE_SHA" --checkout "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --parent /tmp/parent.zip --out /tmp/panel/replay || REPLAY_RC=$?
          printf 'primary_exit=%s replay_exit=%s\n' "$PRIMARY_RC" "$REPLAY_RC"
          test "$PRIMARY_RC" -eq 0
          test "$REPLAY_RC" -eq 0
          cmp /tmp/panel/primary/payload.json /tmp/panel/replay/payload.json
          cmp /tmp/panel/primary/receipt.json /tmp/panel/replay/receipt.json
          sha256sum /tmp/panel/primary/payload.json /tmp/panel/replay/payload.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && steps.panel.outcome != 'skipped' }}
        with:
          name: cneh06h-${{ matrix.arch }}-attempt-${{ github.run_attempt }}
          path: /tmp/panel/
          if-no-files-found: error
          retention-days: 90
  aggregate:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Retrieve exact-attempt native evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$BASE_SHA" = "0f3ae2ee00001b9d99adcedb95443ce6ae3f4bfc"
          curl --fail --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/neuron7x/sapolsky-behave-layers/actions/artifacts/14945669685/zip" --output /tmp/parent.zip
          for arch in aarch64 x86_64; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "cneh06h-$arch-attempt-$GITHUB_RUN_ATTEMPT" --dir "/tmp/profiles/cneh06h-$arch"
          done
      - name: Independently reconstruct and enforce blocked scientific admission
        run: |
          timeout --kill-after=5s 240s python -m experiments.cneh_exp_06h.run aggregate --parent /tmp/parent.zip --profiles /tmp/profiles --head "$HEAD_SHA" --base "$BASE_SHA" --checkout "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --out /tmp/aggregate
          python -m scripts.cneh_promotion_gate check-verdict --experiment CNEH-EXP-06H --verdict /tmp/aggregate/report.json
          (cd /tmp/aggregate && sha256sum --strict -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh06h-aggregate-attempt-${{ github.run_attempt }}
          path: /tmp/aggregate/
          if-no-files-found: error
          retention-days: 90
