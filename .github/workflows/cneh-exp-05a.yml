name: CNEH-EXP-05A sealed counterfactual regret and reachability
on:
  pull_request:
    paths:
      - 'experiments/cneh_exp_05a/**'
      - 'tests/test_cneh_exp_05a*.py'
      - '.github/workflows/cneh-exp-05a.yml'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  native-counterfactual:
    name: Native counterfactual ${{ matrix.arm }}
    strategy:
      fail-fast: false
      matrix:
        arm: [DUAL, CONTROL_ONLY, INFO_ONLY, FIXED_ALTERNATE]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BNSYN_USE_TORCH: '0'
      ARM: ${{ matrix.arm }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate frozen protocol and integrated EXP05
        run: |
          git merge-base --is-ancestor ddbb0bac78a4475c609e79df2f8465361cb03beb HEAD
          git show ddbb0bac78a4475c609e79df2f8465361cb03beb:experiments/cneh_exp_05a/PROTOCOL.md | cmp - experiments/cneh_exp_05a/PROTOCOL.md
          git merge-base --is-ancestor 8cd266c51d9b0ae495e42557dd5da2d5a443dbbd HEAD
          git diff --exit-code 8cd266c51d9b0ae495e42557dd5da2d5a443dbbd HEAD -- experiments/cneh_exp_05 experiments/cneh_exp_04g experiments/cneh_exp_04f_audit experiments/cneh_exp_04f experiments/cneh_exp_04e experiments/cneh_exp_04d experiments/cneh_exp_04c experiments/cneh_exp_04b experiments/cneh_exp_03 experiments/cneh_exp_01
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: neuron7x/bnsyn-phase-controlled-emergent-dynamics
          ref: c1de425ce4ece362e7f2feb2d9f24da5d3231014
          path: .cneh-inputs/bnsyn
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install frozen native dependencies
        run: |
          python -m venv /tmp/cneh05a-env
          /tmp/cneh05a-env/bin/python -m pip install --require-hashes --only-binary=:all: -r experiments/cneh_exp_01/bnsyn-requirements.lock
      - name: Qualify independent bounds, calibration and archive decoder
        run: |
          /tmp/cneh05a-env/bin/python -m unittest discover -s tests -p 'test_cneh_exp_05a*.py' -v
          /tmp/cneh05a-env/bin/python -m unittest discover -s tests -p test_cneh_exp_05.py -v
      - name: Download exact EXP05 historical archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/neuron7x/sapolsky-behave-layers/actions/artifacts/14890028886/zip" --output /tmp/cneh05.zip
          echo 'db78569d633a4fd1ae5649ab02e53a86b48e97f0317b45a849a56cd73e993ea8  /tmp/cneh05.zip' | sha256sum --strict -c -
      - name: Reconstruct every anchor and execute all eight native plans
        run: |
          /tmp/cneh05a-env/bin/python -m experiments.cneh_exp_05a.audit --archive /tmp/cneh05.zip --source .cneh-inputs/bnsyn --arm "$ARM" --out /tmp/cneh05a
      - name: Fresh counterfactual replay and immutable digest verification
        run: |
          /tmp/cneh05a-env/bin/python -m experiments.cneh_exp_05a.audit --archive /tmp/cneh05.zip --source .cneh-inputs/bnsyn --arm "$ARM" --out /tmp/cneh05a --verify
          (cd /tmp/cneh05a && sha256sum --strict -c SHA256SUMS)
      - name: Preserve every valid or invalid diagnostic shard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh-exp-05a-shard-${{ matrix.arm }}
          path: /tmp/cneh05a/
          if-no-files-found: error
          retention-days: 90
  aggregate:
    name: Exact roster and independent evidence aggregation
    needs: native-counterfactual
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retrieve all four same-run diagnostic shards
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'cneh-exp-05a-shard-*' --dir /tmp/shards
      - name: Aggregate complete roster and replay summary
        run: |
          python -m experiments.cneh_exp_05a.audit --shards /tmp/shards --out /tmp/cneh05a-aggregate
          python -m experiments.cneh_exp_05a.audit --shards /tmp/shards --out /tmp/cneh05a-aggregate --verify
          (cd /tmp/cneh05a-aggregate && sha256sum --strict -c SHA256SUMS)
      - name: Preserve aggregate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh-exp-05a-aggregate-SHA256
          path: /tmp/cneh05a-aggregate/
          if-no-files-found: error
          retention-days: 90
