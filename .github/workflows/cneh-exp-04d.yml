name: CNEH-EXP-04D repeated OOD partial-observation recovery
on:
  pull_request:
    paths:
      - 'experiments/cneh_exp_04d/**'
      - 'experiments/cneh_exp_04b/**'
      - 'experiments/cneh_exp_04c/**'
      - 'experiments/cneh_exp_03/**'
      - 'experiments/cneh_exp_01/bnsyn*'
      - 'tests/test_cneh_exp_04d.py'
      - '.github/workflows/cneh-exp-04d.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  repeated-neural-reidentification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BNSYN_USE_TORCH: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify prospective protocol and exact inherited implementations
        run: |
          git merge-base --is-ancestor d1d5dce7f183ea5a8f1feda2a0fd98d11cf63fa6 HEAD
          git show d1d5dce7f183ea5a8f1feda2a0fd98d11cf63fa6:experiments/cneh_exp_04d/PREREGISTRATION.md | cmp - experiments/cneh_exp_04d/PREREGISTRATION.md
          git show fe2737430414f99f6d0b07a40d759657db97666e:experiments/cneh_exp_04b/run.py | cmp - experiments/cneh_exp_04b/run.py
          git show 85eb12431d58677925c755ccbd6fc8bad163d32b:experiments/cneh_exp_04c/qualification.py | cmp - experiments/cneh_exp_04c/qualification.py
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: neuron7x/bnsyn-phase-controlled-emergent-dynamics
          ref: c1de425ce4ece362e7f2feb2d9f24da5d3231014
          path: .cneh-inputs/bnsyn
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned neural runtime
        run: |
          python -m venv /tmp/cneh04d-env
          /tmp/cneh04d-env/bin/python -m pip install --require-hashes --only-binary=:all: -r experiments/cneh_exp_01/bnsyn-requirements.lock --report /tmp/cneh04d-install.json
      - name: Qualify repeated changes and partial observation
        run: |
          /tmp/cneh04d-env/bin/python -m unittest discover -s tests -p test_cneh_exp_04d.py -v
          /tmp/cneh04d-env/bin/python -m unittest discover -s tests -p test_cneh_exp_04c.py -v
      - name: Execute all repeated-OOD and no-change worlds
        run: /tmp/cneh04d-env/bin/python -m experiments.cneh_exp_04d.run --source .cneh-inputs/bnsyn --out /tmp/cneh04d
      - name: Full fresh replay and strict evidence
        run: |
          /tmp/cneh04d-env/bin/python -m experiments.cneh_exp_04d.run --source .cneh-inputs/bnsyn --out /tmp/cneh04d --verify
          (cd /tmp/cneh04d && sha256sum --strict -c SHA256SUMS)
      - name: Archive every world and invalid trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh-exp-04d-repeated-ood-SHA256
          path: |
            /tmp/cneh04d/
            /tmp/cneh04d-install.json
          if-no-files-found: error
          retention-days: 90
