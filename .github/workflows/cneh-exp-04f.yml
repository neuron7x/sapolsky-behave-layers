name: CNEH-EXP-04F matched-budget response-aware causal reidentification
on:
  pull_request:
    paths:
      - 'experiments/cneh_exp_04f/**'
      - 'tests/test_cneh_exp_04f.py'
      - '.github/workflows/cneh-exp-04f.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  matched-budget-neural-control:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BNSYN_USE_TORCH: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen prospective protocol and parent lineage
        run: |
          git merge-base --is-ancestor 025cba728e0c8c70db76259136956df95113100f HEAD
          git show 025cba728e0c8c70db76259136956df95113100f:experiments/cneh_exp_04f/PREREGISTRATION.md | cmp - experiments/cneh_exp_04f/PREREGISTRATION.md
          git diff --exit-code 734ab20f7ed4c632772509303bb703f34b5da295 HEAD -- experiments/cneh_exp_04d experiments/cneh_exp_04c experiments/cneh_exp_04b experiments/cneh_exp_04e experiments/cneh_exp_03 experiments/cneh_exp_01
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: neuron7x/bnsyn-phase-controlled-emergent-dynamics
          ref: c1de425ce4ece362e7f2feb2d9f24da5d3231014
          path: .cneh-inputs/bnsyn
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install frozen simulator dependencies
        run: |
          python -m venv /tmp/cneh04f-env
          /tmp/cneh04f-env/bin/python -m pip install --require-hashes --only-binary=:all: -r experiments/cneh_exp_01/bnsyn-requirements.lock --report /tmp/cneh04f-install.json
      - name: Falsify policy and inherited filter assumptions
        run: |
          /tmp/cneh04f-env/bin/python -m unittest discover -s tests -p test_cneh_exp_04f.py -v
          /tmp/cneh04f-env/bin/python -m unittest discover -s tests -p test_cneh_exp_04e.py -v
          /tmp/cneh04f-env/bin/python -m unittest discover -s tests -p test_cneh_exp_04d.py -v
          /tmp/cneh04f-env/bin/python -m unittest discover -s tests -p test_cneh_exp_04c.py -v
      - name: Run prospective matched-budget cohort
        run: /tmp/cneh04f-env/bin/python -m experiments.cneh_exp_04f.run --source .cneh-inputs/bnsyn --out /tmp/cneh04f
      - name: Fresh deterministic replay and SHA256 verification
        run: |
          /tmp/cneh04f-env/bin/python -m experiments.cneh_exp_04f.run --source .cneh-inputs/bnsyn --out /tmp/cneh04f --verify
          (cd /tmp/cneh04f && sha256sum --strict -c SHA256SUMS)
      - name: Preserve all traces and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh-exp-04f-matched-budget-SHA256
          path: |
            /tmp/cneh04f/
            /tmp/cneh04f-install.json
          if-no-files-found: error
          retention-days: 90
