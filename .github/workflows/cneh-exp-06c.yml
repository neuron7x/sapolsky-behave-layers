name: CNEH-EXP-06C conditional measurement falsification
on:
  pull_request:
    paths:
      - 'experiments/cneh_exp_06c/**'
      - 'tests/test_cneh_exp_06c.py'
      - '.github/workflows/cneh-exp-06c.yml'
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  native:
    name: Native ${{ matrix.arch }} measurement contract
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze parent and measurement subject
        run: |
          git merge-base --is-ancestor b0b915a3659db56c1dbb5714822db762b8129d1f HEAD
          git show b0b915a3659db56c1dbb5714822db762b8129d1f:experiments/cneh_exp_06c/PROTOCOL.md | cmp - experiments/cneh_exp_06c/PROTOCOL.md
          git diff --exit-code aacd559e4d80179c8e3a6256c3501598eeacd3bf HEAD -- 'experiments/cneh_exp_05*' experiments/cneh_exp_06a experiments/cneh_exp_06b scripts/cneh_promotion_gate.py
          test "$(uname -m)" = "$ARCH"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Retrieve immutable negative evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/neuron7x/sapolsky-behave-layers/actions/artifacts/14926773571/zip" --output /tmp/parent.zip
          echo '1088d75b4f145bd1294c673b3e9a35e19d7bd3a485910e029349d24cbfc83ab3  /tmp/parent.zip' | sha256sum --strict -c -
      - name: Verify mathematical and semantic contracts
        run: python -m unittest discover -s tests -p test_cneh_exp_06c.py -v
      - name: Execute fixed bounded-noise and OOD alias panel
        run: python -m experiments.cneh_exp_06c.run run --arch "$ARCH" --parent /tmp/parent.zip --out /tmp/result
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh06c-${{ matrix.arch }}
          path: /tmp/result/
          if-no-files-found: error
          retention-days: 90
  aggregate:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Retrieve parent and both native payloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" "https://api.github.com/repos/neuron7x/sapolsky-behave-layers/actions/artifacts/14926773571/zip" --output /tmp/parent.zip
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'cneh06c-*' --dir /tmp/profiles
      - name: Exact independent regeneration and negative authority check
        run: |
          python -m experiments.cneh_exp_06c.run aggregate --parent /tmp/parent.zip --profiles /tmp/profiles --head "$HEAD_SHA" --run-id "$GITHUB_RUN_ID" --out /tmp/aggregate
          python -m scripts.cneh_promotion_gate check-verdict --experiment CNEH-EXP-06C --verdict /tmp/aggregate/report.json
          (cd /tmp/aggregate && sha256sum --strict -c SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh06c-aggregate
          path: /tmp/aggregate/
          if-no-files-found: error
          retention-days: 90
