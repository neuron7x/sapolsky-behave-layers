name: pr-audit

# Free, read-only checks for supply-chain and workflow regressions.
# All commands also run locally; no paid service or repository secret is required.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "cwc-requirements-dev.txt"
      - "requirements/**"
      - "scripts/cwc_dependency_audit.py"
      - "tests/test_cwc_dependency_audit.py"

permissions:
  contents: read

concurrency:
  group: pr-audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-audit:
    name: Validate GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo" \
            -w /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color \
            .github/workflows/*.yml

  secret-audit:
    name: Scan complete Git history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run Gitleaks with redacted output
        run: make -f Makefile.cwc secret-scan

  dependency-audit:
    name: Audit Python tooling dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install uv
        run: |
          python -m pip install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r requirements/ci-uv.lock
          uv --version
      - name: Check locked runtime and development dependencies against advisories
        run: make -f Makefile.cwc dependency-audit
