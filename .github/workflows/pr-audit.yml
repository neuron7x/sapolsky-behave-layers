name: pr-audit

# Free, read-only checks for supply-chain and workflow regressions.
# All commands also run locally; no paid service or repository secret is required.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "cwc-requirements-dev.txt"

permissions:
  contents: read

concurrency:
  group: pr-audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-audit:
    name: Validate GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run actionlint
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo" \
            -w /repo \
            rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -color \
            .github/workflows/*.yml

  secret-audit:
    name: Scan complete Git history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks with redacted output
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            git --redact --no-banner --exit-code 1 --log-opts=--all

  dependency-audit:
    name: Audit Python tooling dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv
        run: pipx install uv==0.10.12
      - name: Check locked runtime and pinned development dependencies against OSV
        run: make -f Makefile.cwc dependency-audit

  dependency-review:
    name: Reject vulnerable dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
