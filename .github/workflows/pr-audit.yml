name: pr-audit

# Free, read-only checks for supply-chain and workflow regressions.
# All commands also run locally; no paid service or repository secret is required.
on:
  pull_request:
  push:
    branches: [master]
    paths:
      - ".github/workflows/**"
      - "cwc-requirements-dev.txt"

permissions:
  contents: read

concurrency:
  group: pr-audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-audit:
    name: Validate GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo" \
            -w /repo \
            rhysd/actionlint:1.7.7 \
            -color \
            .github/workflows/*.yml

  secret-audit:
    name: Scan complete Git history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks with redacted output
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.28.0 \
            git --redact --no-banner --exit-code 1 --log-opts=--all

  dependency-audit:
    name: Audit Python tooling dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: pipx install uv
      - name: Check pinned development dependencies against OSV
        run: uvx --from pip-audit pip-audit -r cwc-requirements-dev.txt --progress-spinner=off

  dependency-review:
    name: Reject vulnerable dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
