name: CNEH-EXP-04B neural pathway reidentification
on:
  pull_request:
    paths:
      - 'experiments/cneh_exp_04b/**'
      - 'tests/test_cneh_exp_04b.py'
      - '.github/workflows/cneh-exp-04b.yml'
      - 'experiments/cneh_exp_03/**'
      - 'experiments/cneh_exp_01/bnsyn*'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  observation-only-neural-reidentification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BNSYN_USE_TORCH: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify prospective protocol
        run: git show 1d03a353b798b66eb118e33e9802ffabda1877e4:experiments/cneh_exp_04b/PREREGISTRATION.md | cmp - experiments/cneh_exp_04b/PREREGISTRATION.md
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: neuron7x/bnsyn-phase-controlled-emergent-dynamics
          ref: c1de425ce4ece362e7f2feb2d9f24da5d3231014
          path: .cneh-inputs/bnsyn
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned neural runtime
        run: |
          python -m venv /tmp/cneh04b-env
          /tmp/cneh04b-env/bin/python -m pip install --require-hashes --only-binary=:all: -r experiments/cneh_exp_01/bnsyn-requirements.lock --report /tmp/cneh04b-install.json
      - name: Mathematical and interface falsifiers
        run: /tmp/cneh04b-env/bin/python -m unittest discover -s tests -p test_cneh_exp_04b.py -v
      - name: Execute all frozen neural worlds
        run: /tmp/cneh04b-env/bin/python -m experiments.cneh_exp_04b.run --source .cneh-inputs/bnsyn --out /tmp/cneh04b
      - name: Full replay and strict manifest
        run: |
          /tmp/cneh04b-env/bin/python -m experiments.cneh_exp_04b.run --source .cneh-inputs/bnsyn --out /tmp/cneh04b --verify
          (cd /tmp/cneh04b && sha256sum --strict -c SHA256SUMS)
      - name: Archive all evidence and any counterexamples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh-exp-04b-neural-pathways-SHA256
          path: |
            /tmp/cneh04b/
            /tmp/cneh04b-install.json
          if-no-files-found: error
          retention-days: 90
