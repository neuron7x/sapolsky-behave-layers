name: CNEH artifact transport truth gate
on:
  pull_request:
    paths:
      - '.github/workflows/cneh-exp-05x.yml'
      - '.github/workflows/cneh-exp-05y.yml'
      - '.github/workflows/cneh-artifact-transport-audit.yml'
      - 'scripts/cneh_artifact_transport.py'
      - 'scripts/truth_gate.py'
      - 'tests/test_cneh_artifact_transport.py'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Canonical anti-green truth gate
        run: python scripts/truth_gate.py
      - name: Falsify successful-looking transport failures
        run: python -m unittest discover -s tests -p test_cneh_artifact_transport.py -v
