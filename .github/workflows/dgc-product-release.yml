name: dgc-product-release

permissions:
  contents: read

on:
  push:
    tags:
      - "dgc-product-*"

jobs:
  product-qualified-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Require PRODUCT_QUALIFIED current truth
        run: PYTHONPATH=. python scripts/dgc_product_promotion_gate.py --require-stage PRODUCT_QUALIFIED
      - name: Require complete SHA-sealed product evidence bundle
        run: PYTHONPATH=. python scripts/dgc_product_bundle_gate.py
      - name: Re-run product evidence contracts from the release tree
        run: |
          python -m pip install pytest
          PYTHONPATH=. python -m pytest -q \
            tests/test_dgc_product_economics.py \
            tests/test_dgc_product_statistical_plan.py \
            tests/test_dgc_evaluation_harness.py \
            tests/test_dgc_product_evidence.py \
            tests/test_dgc_evidence_bundle.py \
            tests/test_dgc_workload_seal.py \
            tests/test_dgc_baseline_panel.py \
            tests/test_dgc_deployment_qualification.py \
            tests/test_dgc_independent_replication.py \
            tests/test_dgc_physical_cost_evidence.py
