# Act CWC-LAB-DOC-2026-01 §11 — documentation & evidence gates.
# These gates run on GitHub and are also runnable locally via `make -f Makefile.cwc`.
name: cwc-doc-gates

permissions:
  contents: read

on:
  push:
    branches: [ "**" ]
  pull_request:

concurrency:
  group: cwc-doc-gates-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  doc-and-evidence-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0                       # doc-gate needs history for ancestry check
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install uv
        run: |
          python -m pip install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r requirements/ci-uv.lock
          uv --version
      - name: Sync frozen environment
        run: uv sync --frozen
      - name: Bibliography gate (every citation machine-resolved, argued, claim-attached)
        run: PYTHONPATH=. .venv/bin/python scripts/verify_bibliography.py
      - name: Documentation status gate (schema, traceability, freshness)
        run: PYTHONPATH=. .venv/bin/python scripts/doc_status_gate.py
      - name: Check the synthetic dataset register and rejection controls
        run: |
          .venv/bin/python -B -m unittest discover -s tests -p test_documentation_dataset_register.py -v
          .venv/bin/python -B scripts/check_dataset_register.py
      - name: Evidence checksum gate
        run: make -f Makefile.cwc verify-evidence
      - name: Regenerated docs are in sync (ledger + register)
        run: |
          make -f Makefile.cwc docs-regen
          git diff --exit-code docs/lab/EXPERIMENT_LEDGER.jsonl docs/vnv/DOCUMENT_STATUS_REGISTER.csv
