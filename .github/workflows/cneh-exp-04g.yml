name: CNEH-EXP-04G source excitability and actuator qualification
on:
  pull_request:
    paths:
      - 'experiments/cneh_exp_04g/**'
      - 'tests/test_cneh_exp_04g.py'
      - '.github/workflows/cneh-exp-04g.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  native-source-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BNSYN_USE_TORCH: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate frozen prospective protocol and parent
        run: |
          git merge-base --is-ancestor 38f0e884aa323a91a3bb2b8deac7cb65070c2b42 HEAD
          git show 38f0e884aa323a91a3bb2b8deac7cb65070c2b42:experiments/cneh_exp_04g/PREREGISTRATION.md | cmp - experiments/cneh_exp_04g/PREREGISTRATION.md
          git diff --exit-code e1e53a3364d9cdbf330662af104083613f214761 HEAD -- experiments/cneh_exp_04f experiments/cneh_exp_04f_audit experiments/cneh_exp_04e experiments/cneh_exp_04d experiments/cneh_exp_04c experiments/cneh_exp_04b experiments/cneh_exp_03 experiments/cneh_exp_01
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: neuron7x/bnsyn-phase-controlled-emergent-dynamics
          ref: c1de425ce4ece362e7f2feb2d9f24da5d3231014
          path: .cneh-inputs/bnsyn
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install frozen simulator dependencies
        run: |
          python -m venv /tmp/cneh04g-env
          /tmp/cneh04g-env/bin/python -m pip install --require-hashes --only-binary=:all: -r experiments/cneh_exp_01/bnsyn-requirements.lock --report /tmp/cneh04g-install.json
      - name: Qualify budget, source clamp and model boundary
        run: |
          /tmp/cneh04g-env/bin/python -m unittest discover -s tests -p test_cneh_exp_04g.py -v
          /tmp/cneh04g-env/bin/python -m unittest discover -s tests -p test_cneh_exp_04f.py -v
          /tmp/cneh04g-env/bin/python -m unittest discover -s tests -p test_cneh_exp_04f_audit.py -v
      - name: Execute all prospective calibration and paired worlds
        run: /tmp/cneh04g-env/bin/python -m experiments.cneh_exp_04g.run --source .cneh-inputs/bnsyn --out /tmp/cneh04g
      - name: Fresh full replay and SHA256
        run: |
          /tmp/cneh04g-env/bin/python -m experiments.cneh_exp_04g.run --source .cneh-inputs/bnsyn --out /tmp/cneh04g --verify
          (cd /tmp/cneh04g && sha256sum --strict -c SHA256SUMS)
      - name: Enforce CNEH negative-only scientific authority boundary
        run: python -m scripts.cneh_promotion_gate check-verdict --experiment CNEH-EXP-04G --verdict /tmp/cneh04g/verdict.json
      - name: Preserve all calibration and experiment traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cneh-exp-04g-source-qualification-SHA256
          path: |
            /tmp/cneh04g/
            /tmp/cneh04g-install.json
          if-no-files-found: error
          retention-days: 90
