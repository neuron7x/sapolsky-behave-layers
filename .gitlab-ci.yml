# Fail-closed GitLab admission pipeline for the CWC research repository.
# Runs on a project-locked, unprivileged Docker runner; no paid SaaS minutes.

stages:
  - audit
  - quality
  - evidence
  - reproduce

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  image:
    name: python:3.10.20-bookworm@sha256:be77ec026cf35f6adf5f4f02015d50b7aadaac98659a02be1fc8ce18c396f652
  tags:
    - cwc-docker
  interruptible: true
  timeout: 60m

truth-gate:
  stage: audit
  script:
    - PYTHONPATH=. python scripts/truth_gate.py

workflow-audit:
  stage: audit
  image:
    name: rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
    entrypoint: [""]
  script:
    - actionlint -color .github/workflows/*.yml

secret-audit:
  stage: audit
  image:
    name: zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  script:
    - gitleaks git --redact --no-banner --exit-code 1 --log-opts=--all

dependency-audit:
  stage: audit
  before_script:
    - python -m pip install uv==0.10.12 pip-audit==2.10.1
  script:
    - make -f Makefile.cwc dependency-audit

quality:
  stage: quality
  before_script:
    - python -m pip install -r cwc-requirements-dev.txt
  script:
    - python -m ruff check .
    - python -m mypy --config-file mypy.ini cwc/
    - >
      python -m pytest -q -m "not slow and not mutation and not cuda"
      tests/test_instrumentation_*.py
      --cov=cwc/instrumentation --cov-branch
      --cov-report=term-missing --cov-fail-under=85
    - python scripts/mutation_probe.py

evidence-and-docs:
  stage: evidence
  variables:
    GIT_DEPTH: "0"
  before_script:
    - python -m pip install PyYAML==6.0.3
  script:
    - PYTHONPATH=. python scripts/verify_bibliography.py
    - PYTHONPATH=. python scripts/doc_status_gate.py
    - PYTHONPATH=. python scripts/validate_evidence.py
    - make -f Makefile.cwc PY=python verify-evidence
    - make -f Makefile.cwc PY=python docs-regen
    - git diff --exit-code docs/lab/EXPERIMENT_LEDGER.jsonl docs/vnv/DOCUMENT_STATUS_REGISTER.csv

fractal-verification:
  stage: evidence
  image:
    name: python:3.11.15-bookworm@sha256:5c34b355088846dddc8afb7442c20b9433dccdc8d66192dc52c616adeaa106a3
  before_script:
    - python -m pip install uv==0.10.12
    - uv sync --frozen --project experiments/fractal_multiscale --extra dev
  script:
    - uv run --frozen --project experiments/fractal_multiscale make -C experiments/fractal_multiscale verify

full-verification:
  stage: reproduce
  variables:
    GIT_DEPTH: "0"
  before_script:
    - python -m pip install uv==0.10.12
    - uv sync --frozen --extra cpu
    - VIRTUAL_ENV=.venv uv pip install -r cwc-requirements-dev.txt
  script:
    - make -f Makefile.cwc verify-full
    - PYTHONPATH=. .venv/bin/python scripts/truth_gate.py
